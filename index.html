<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuentas</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --ink:#12211d; --paper:#f6f4ee; --line:#d9d3c3;
  --teal:#1f4d43; --teal-2:#2f6e5f; --gold:#c08a2e;
  --red:#a3402f; --muted:#6b6558; --card:#ffffff;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#eae6da; --paper:#141a17; --line:#2b352f;
    --teal:#7fb8a6; --teal-2:#5c9683; --gold:#e0ac4e;
    --red:#e08a77; --muted:#9b9284; --card:#1b2320;
  }
}
:root[data-theme="dark"]{
  --ink:#eae6da; --paper:#141a17; --line:#2b352f;
  --teal:#7fb8a6; --teal-2:#5c9683; --gold:#e0ac4e;
  --red:#e08a77; --muted:#9b9284; --card:#1b2320;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  min-height:100%;
}
header{
  padding:28px 20px 18px; border-bottom:1px solid var(--line);
  position:sticky; top:env(safe-area-inset-top,0px); background:var(--paper); z-index:5;
}
header h1{margin:0 0 4px; font-size:22px; font-weight:700; letter-spacing:-0.01em}
header p{margin:0; color:var(--muted); font-size:13px}
.periodo{display:flex; gap:8px; margin-top:12px}
.periodo select{width:auto; padding:6px 8px; font-size:13px}
.balance{display:flex; gap:22px; margin-top:16px; flex-wrap:wrap}
.balance div{min-width:100px}
.balance .num{font-size:22px; font-weight:700; font-variant-numeric:tabular-nums}
.balance .lbl{font-size:12px; color:var(--muted); margin-top:2px}
.pos{color:var(--teal)} .neg{color:var(--red)}
nav{display:flex; gap:4px; padding:10px 16px; overflow-x:auto; border-bottom:1px solid var(--line)}
nav button{
  border:none; background:transparent; color:var(--muted); padding:8px 14px;
  border-radius:20px; font-size:14px; cursor:pointer; white-space:nowrap; font-weight:600;
}
nav button.active{background:var(--teal); color:var(--paper)}
main{padding:18px 16px 60px; max-width:640px; margin:0 auto}
.card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px}
form{display:grid; gap:10px}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
label{font-size:12px; color:var(--muted); display:block; margin-bottom:4px}
input,select{
  width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px;
  background:var(--paper); color:var(--ink); font-size:14px; font-family:inherit;
}
input:focus,select:focus{outline:2px solid var(--teal-2); outline-offset:1px}
.btn{
  background:var(--teal); color:var(--paper); border:none; padding:10px 14px;
  border-radius:8px; font-size:14px; font-weight:600; cursor:pointer;
}
.btn:hover{background:var(--teal-2)}
.btn.ghost{background:transparent; color:var(--red); border:1px solid var(--line); padding:5px 10px; font-size:12px}
.btn.gold{background:var(--gold); color:#26200f}
.list{display:flex; flex-direction:column; gap:8px}
.item{
  display:flex; justify-content:space-between; align-items:center; gap:10px;
  padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:var(--card);
}
.item .meta{font-size:12px; color:var(--muted); margin-top:2px}
.item .amt{font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}
.tag{font-size:11px; padding:2px 8px; border-radius:20px; background:var(--paper); border:1px solid var(--line); color:var(--muted)}
.empty{color:var(--muted); font-size:13px; text-align:center; padding:30px 10px}
h2{font-size:15px; margin:0 0 12px}
.section-title{font-size:13px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin:20px 0 8px}
.status{font-size:12px; color:var(--muted); text-align:center; padding:6px}
.errbar{
  display:none; background:var(--red); color:#fff; padding:10px 16px; font-size:13px;
  align-items:center; justify-content:space-between; gap:10px;
}
.errbar.show{display:flex}
.errbar button{background:rgba(255,255,255,.2); color:#fff; border:none; padding:6px 10px; border-radius:6px; font-size:12px; cursor:pointer; white-space:nowrap}
</style>
</head>
<body>
<div class="card" id="authScreen" style="max-width:420px;margin:60px auto;display:none">
  <h2>Inicia sesión</h2>
  <p class="meta">Te enviamos un enlace a tu correo, sin contraseña que recordar.</p>
  <form id="fLogin">
    <label>Tu nombre</label>
    <input type="text" id="loginNombre" required placeholder="ej. Adrián">
    <label>Email</label>
    <input type="email" id="loginEmail" required placeholder="tu@email.com">
    <button class="btn" type="submit">Enviar enlace</button>
  </form>
  <div id="loginMsg" class="meta" style="margin-top:8px"></div>
</div>
<div id="appShell" style="display:none">
  <header>
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div><h1>Nuestras cuentas</h1><p id="sesionInfo" style="margin:0;color:var(--muted);font-size:12px"></p></div>
      <button class="btn ghost" id="btnLogout">Cerrar sesión</button>
    </div>
    <div class="balance" id="balanceBox"></div>
    <div class="periodo" id="periodoBox"></div>
  </header>
  <div class="errbar" id="errBar"><span id="errMsg"></span><button id="errRetry">Reintentar</button></div>
  <nav id="tabs"></nav>
  <main id="app"></main>
</div>
<script>
const TABS = ["Movimientos","Deudas","Cuentas","Inversiones"];
let tab = "Movimientos";
let ready = false;
let movimientos = [], deudas = [], cuentas = [], inversiones = [], aportaciones = [];
let aportarInvId = null, editarValorInvId = null;
let session = null, appStarted = false;

// --- Configura aquí tu proyecto de Supabase ---
const SUPABASE_URL = "https://qlgtgmgtijjzqwxkhwdg.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFsZ3RnbWd0aWpqenF3eGtod2RnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNDU1OTcsImV4cCI6MjEwNTgyMTU5N30.HZx4Sh-gic5ZG7i80utcShW_Jxwa20dATo0kdvIwoIA";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const CAT_GASTO = ["Imprescindible","Prescindible","Comer fuera","Compras","Suscripciones","Gasolina","Otro"];
const CAT_INGRESO = ["Nómina","Extra","Bizum","Otro"];
const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
let periodoMes = "todos"; // "todos" o "1".."12"
let periodoAnio = new Date().getFullYear();
let saldarId = null; // deuda que se está saldando ahora mismo

function showError(msg){
  const bar = document.getElementById("errBar");
  document.getElementById("errMsg").textContent = msg;
  bar.classList.add("show");
  document.getElementById("errRetry").onclick = ()=>{ hideError(); fetchAll(); };
}
function hideError(){ document.getElementById("errBar").classList.remove("show"); }

function eur(n){ return (n<0?"-":"") + "€" + Math.abs(n).toFixed(2).replace(".",","); }
function today(){ return new Date().toISOString().slice(0,10); }
function enPeriodo(fecha){
  if(!fecha) return false;
  const [y,m] = fecha.split("-");
  if(Number(y) !== periodoAnio) return false;
  return periodoMes==="todos" ? true : Number(m)===Number(periodoMes);
}

function renderPeriodo(){
  const years = Array.from(new Set([...movimientos.map(m=>Number((m.fecha||"").slice(0,4))).filter(Boolean), periodoAnio])).sort((a,b)=>b-a);
  document.getElementById("periodoBox").innerHTML = `
    <select id="selMes">
      <option value="todos" ${periodoMes==="todos"?"selected":""}>Total del año</option>
      ${MESES.map((m,i)=>`<option value="${i+1}" ${periodoMes===String(i+1)?"selected":""}>${m}</option>`).join("")}
    </select>
    <select id="selAnio">${years.map(y=>`<option value="${y}" ${y===periodoAnio?"selected":""}>${y}</option>`).join("")}</select>
  `;
  document.getElementById("selMes").onchange = e=>{periodoMes=e.target.value; render();};
  document.getElementById("selAnio").onchange = e=>{periodoAnio=Number(e.target.value); render();};
}

function renderTabs(){
  document.getElementById("tabs").innerHTML = TABS.map(t =>
    `<button class="${t===tab?'active':''}" data-tab="${t}">${t}</button>`).join("");
  document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab; render();});
}

function renderBalance(){
  const enP = movimientos.filter(m=>enPeriodo(m.fecha));
  const ingresos = enP.filter(m=>m.tipo==="ingreso").reduce((s,m)=>s+m.importe,0);
  const gastos = enP.filter(m=>m.tipo==="gasto").reduce((s,m)=>s+m.importe,0);
  const meDeben = deudas.filter(d=>d.direccion==="me_deben" && d.estado==="pendiente").reduce((s,d)=>s+d.importe,0);
  const debo = deudas.filter(d=>d.direccion==="debo" && d.estado==="pendiente").reduce((s,d)=>s+d.importe,0);
  const lbl = periodoMes==="todos" ? `Año ${periodoAnio}` : `${MESES[Number(periodoMes)-1]} ${periodoAnio}`;
  document.getElementById("balanceBox").innerHTML = `
    <div><div class="num pos">${eur(ingresos)}</div><div class="lbl">Ingresos · ${lbl}</div></div>
    <div><div class="num neg">${eur(gastos)}</div><div class="lbl">Gastos · ${lbl}</div></div>
    <div><div class="num ${ingresos-gastos>=0?'pos':'neg'}">${eur(ingresos-gastos)}</div><div class="lbl">Balance</div></div>
    <div><div class="num pos">${eur(meDeben)}</div><div class="lbl">Me deben (total)</div></div>
    <div><div class="num neg">${eur(debo)}</div><div class="lbl">Debo (total)</div></div>
  `;
}

function cuentaNombre(id){ const c = cuentas.find(c=>c.id===id); return c? c.nombre : "Sin cuenta"; }
function aportadoInv(id){ return aportaciones.filter(a=>a.inversionId===id).reduce((s,a)=>s+a.importe,0); }
function saldoCuenta(c){
  const ing = movimientos.filter(m=>m.cuentaId===c.id && m.tipo==="ingreso").reduce((s,m)=>s+m.importe,0);
  const gas = movimientos.filter(m=>m.cuentaId===c.id && m.tipo==="gasto").reduce((s,m)=>s+m.importe,0);
  return (c.saldoInicial||0) + ing - gas;
}

function renderMovimientos(){
  const items = movimientos.filter(m=>enPeriodo(m.fecha)).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  return `
  <div class="card">
    <h2>Añadir movimiento</h2>
    <form id="fMov">
      <div class="row2">
        <div><label>Tipo</label><select name="tipo" id="movTipo"><option value="gasto">Gasto</option><option value="ingreso">Ingreso</option></select></div>
        <div><label>Importe (€)</label><input name="importe" type="number" step="0.01" min="0" required></div>
      </div>
      <div class="row2">
        <div><label>Categoría</label><select name="categoria" id="movCat"></select></div>
        <div><label>Fecha</label><input name="fecha" type="date" value="${today()}" required></div>
      </div>
      <div><label>Cuenta</label>${cuentas.length? `<select name="cuentaId">${cuentas.map(c=>`<option value="${c.id}">${c.nombre}</option>`).join("")}</select>` : `<div class="meta">Crea antes una cuenta en la pestaña "Cuentas".</div>`}</div>
      <div><label>Nota (opcional)</label><input name="nota" placeholder="ej. cena viernes"></div>
      <button class="btn" type="submit" ${cuentas.length?"":"disabled"}>Añadir</button>
    </form>
  </div>
  <div class="section-title">Historial (${items.length})</div>
  <div class="list">
    ${items.length? items.map(m=>`
      <div class="item">
        <div>
          <span class="tag">${m.categoria}</span>
          <span class="tag">${cuentaNombre(m.cuentaId)}</span>
          ${m.nota?`<div class="meta">${m.nota}</div>`:""}
          <div class="meta">${m.fecha}</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <div class="amt ${m.tipo==='ingreso'?'pos':'neg'}">${m.tipo==='ingreso'?'+':'-'}${eur(m.importe)}</div>
          <button class="btn ghost" data-del-mov="${m.id}">Borrar</button>
        </div>
      </div>`).join("") : `<div class="empty">Aún no hay movimientos. Añade el primero arriba.</div>`}
  </div>`;
}

function renderDeudas(){
  const items = [...deudas].sort((a,b)=> (a.estado===b.estado?0:(a.estado==="pendiente"?-1:1)));
  return `
  <div class="card">
    <h2>Nueva deuda</h2>
    <form id="fDeuda">
      <div class="row2">
        <div><label>Persona</label><input name="persona" placeholder="ej. Marta" required></div>
        <div><label>Importe (€)</label><input name="importe" type="number" step="0.01" min="0" required></div>
      </div>
      <div class="row2">
        <div><label>Dirección</label><select name="direccion"><option value="debo">Yo debo</option><option value="me_deben">Me deben</option></select></div>
        <div><label>Fecha</label><input name="fecha" type="date" value="${today()}" required></div>
      </div>
      <div><label>Concepto</label><input name="concepto" placeholder="ej. cena cumpleaños"></div>
      <button class="btn" type="submit">Añadir</button>
    </form>
  </div>
  <div class="section-title">Deudas (${items.length})</div>
  <div class="list">
    ${items.length? items.map(d=>`
      <div class="item">
        <div>
          <strong>${d.persona}</strong>
          <span class="tag">${d.direccion==='debo'?'Yo debo':'Me deben'}</span>
          ${d.estado==='saldado'?'<span class="tag">Saldado</span>':''}
          ${d.concepto?`<div class="meta">${d.concepto}</div>`:""}
          <div class="meta">${d.fecha}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <div class="amt ${d.direccion==='me_deben'?'pos':'neg'}">${eur(d.importe)}</div>
          ${d.estado==='pendiente' && saldarId!==d.id?`<button class="btn gold" data-saldar="${d.id}">Saldar</button>`:''}
          <button class="btn ghost" data-del-deuda="${d.id}">Borrar</button>
        </div>
      </div>
      ${saldarId===d.id? `
      <div class="item" style="flex-direction:column;align-items:stretch;gap:8px">
        <label>${d.direccion==='me_deben'?'¿A qué cuenta entra el pago?':'¿De qué cuenta sale el pago?'}</label>
        ${cuentas.length? `<select id="saldarCuenta">${cuentas.map(c=>`<option value="${c.id}">${c.nombre}</option>`).join("")}</select>` : `<div class="meta">Crea antes una cuenta en la pestaña "Cuentas".</div>`}
        <div style="display:flex;gap:8px">
          <button class="btn" data-confirmar-saldar="${d.id}" ${cuentas.length?"":"disabled"}>Confirmar</button>
          <button class="btn ghost" data-cancelar-saldar="1">Cancelar</button>
        </div>
      </div>` : ""}`).join("") : `<div class="empty">Sin deudas registradas.</div>`}
  </div>`;
}

function renderCuentas(){
  const items = [...cuentas].sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const total = items.reduce((s,c)=>s+saldoCuenta(c),0);
  return `
  <div class="card">
    <h2>Añadir cuenta</h2>
    <form id="fCuenta">
      <div class="row2">
        <div><label>Nombre</label><input name="nombre" placeholder="ej. Trade Republic" required></div>
        <div><label>Saldo inicial (€)</label><input name="saldoInicial" type="number" step="0.01" value="0" required></div>
      </div>
      <button class="btn" type="submit">Añadir</button>
    </form>
  </div>
  <div class="section-title">Cuentas · Total ${eur(total)}</div>
  <div class="list">
    ${items.length? items.map(c=>`
      <div class="item">
        <div><strong>${c.nombre}</strong><div class="meta">Inicial ${eur(c.saldoInicial||0)}</div></div>
        <div style="display:flex;align-items:center;gap:10px">
          <div class="amt">${eur(saldoCuenta(c))}</div>
          <button class="btn ghost" data-del-cuenta="${c.id}">Borrar</button>
        </div>
      </div>`).join("") : `<div class="empty">Sin cuentas todavía. Crea la primera arriba.</div>`}
  </div>`;
}

function renderInversiones(){
  const items = [...inversiones].sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const totalValor = items.reduce((s,i)=>s+i.valorActual,0);
  const totalAportado = items.reduce((s,i)=>s+aportadoInv(i.id),0);
  const totalBeneficio = totalValor - totalAportado;
  return `
  <div class="card">
    <h2>Nueva inversión</h2>
    <form id="fInversion">
      <div class="row2">
        <div><label>Nombre</label><input name="nombre" placeholder="ej. Trade Republic" required></div>
        <div><label>Tipo (opcional)</label><input name="tipo" placeholder="ej. ETF, inmobiliaria..."></div>
      </div>
      <div><label>Valor actual inicial (€)</label><input name="valorActual" type="number" step="0.01" value="0" required></div>
      <button class="btn" type="submit">Añadir</button>
    </form>
  </div>
  <div class="section-title">Inversiones · Valor ${eur(totalValor)} · Beneficio ${eur(totalBeneficio)}</div>
  <div class="list">
    ${items.length? items.map(inv=>{
      const aportado = aportadoInv(inv.id);
      const beneficio = inv.valorActual - aportado;
      return `
      <div class="item">
        <div>
          <strong>${inv.nombre}</strong>
          ${inv.tipo?`<span class="tag">${inv.tipo}</span>`:""}
          <div class="meta">Aportado: ${eur(aportado)}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <div class="amt">${eur(inv.valorActual)}</div>
          <button class="btn ghost" data-del-inv="${inv.id}">Borrar</button>
        </div>
      </div>
      <div class="meta" style="padding:0 4px 6px">Beneficio: <span class="${beneficio>=0?'pos':'neg'}">${eur(beneficio)}</span></div>
      <div style="display:flex;gap:8px;padding:0 4px 8px">
        ${aportarInvId!==inv.id?`<button class="btn gold" data-aportar-inv="${inv.id}">Aportar</button>`:""}
        ${editarValorInvId!==inv.id?`<button class="btn ghost" data-editar-valor="${inv.id}">Actualizar valor</button>`:""}
      </div>
      ${aportarInvId===inv.id? `
      <div class="item" style="flex-direction:column;align-items:stretch;gap:8px">
        <label>Importe a aportar (€)</label>
        <input type="number" step="0.01" min="0" id="aportarImporte">
        <label>Cuenta de origen</label>
        ${cuentas.length? `<select id="aportarCuenta">${cuentas.map(c=>`<option value="${c.id}">${c.nombre}</option>`).join("")}</select>` : `<div class="meta">Crea antes una cuenta en la pestaña "Cuentas".</div>`}
        <div style="display:flex;gap:8px">
          <button class="btn" data-confirmar-aportar="${inv.id}" ${cuentas.length?"":"disabled"}>Confirmar</button>
          <button class="btn ghost" data-cancelar-aportar="1">Cancelar</button>
        </div>
      </div>` : ""}
      ${editarValorInvId===inv.id? `
      <div class="item" style="flex-direction:column;align-items:stretch;gap:8px">
        <label>Nuevo valor actual (€)</label>
        <input type="number" step="0.01" id="valorNuevo" value="${inv.valorActual}">
        <div style="display:flex;gap:8px">
          <button class="btn" data-confirmar-valor="${inv.id}">Guardar</button>
          <button class="btn ghost" data-cancelar-valor="1">Cancelar</button>
        </div>
      </div>` : ""}`;
    }).join("") : `<div class="empty">Sin inversiones todavía. Crea la primera arriba.</div>`}
  </div>`;
}

function render(){
  renderTabs();
  renderBalance();
  renderPeriodo();
  const app = document.getElementById("app");
  if(!ready){ app.innerHTML = `<div class="status">Cargando...</div>`; return; }
  if(tab==="Movimientos") app.innerHTML = renderMovimientos();
  else if(tab==="Deudas") app.innerHTML = renderDeudas();
  else if(tab==="Cuentas") app.innerHTML = renderCuentas();
  else app.innerHTML = renderInversiones();
  wireEvents();
}

function wireEvents(){
  const cat = document.getElementById("movCat");
  const tipo = document.getElementById("movTipo");
  if(cat){
    const fill = ()=> cat.innerHTML = (tipo.value==="gasto"?CAT_GASTO:CAT_INGRESO).map(c=>`<option>${c}</option>`).join("");
    fill(); tipo.onchange = fill;
  }
  const fMov = document.getElementById("fMov");
  if(fMov) fMov.onsubmit = async (e)=>{
    e.preventDefault();
    const f = new FormData(fMov);
    const data = {tipo:f.get("tipo"), categoria:f.get("categoria"), importe:parseFloat(f.get("importe")), fecha:f.get("fecha"), nota:f.get("nota")||"", cuenta_id:f.get("cuentaId")||null};
    const {error} = await sb.from("movimientos").insert(data);
    if(error){ showError("No se pudo guardar el movimiento: "+error.message); return; }
    hideError(); fMov.reset(); await fetchAll();
  };
  const fDeuda = document.getElementById("fDeuda");
  if(fDeuda) fDeuda.onsubmit = async (e)=>{
    e.preventDefault();
    const f = new FormData(fDeuda);
    const data = {persona:f.get("persona"), importe:parseFloat(f.get("importe")), direccion:f.get("direccion"), fecha:f.get("fecha"), concepto:f.get("concepto")||"", estado:"pendiente"};
    const {error} = await sb.from("deudas").insert(data);
    if(error){ showError("No se pudo guardar la deuda: "+error.message); return; }
    hideError(); fDeuda.reset(); await fetchAll();
  };
  const fCuenta = document.getElementById("fCuenta");
  if(fCuenta) fCuenta.onsubmit = async (e)=>{
    e.preventDefault();
    const f = new FormData(fCuenta);
    const data = {nombre:f.get("nombre"), saldo_inicial:parseFloat(f.get("saldoInicial"))};
    const {error} = await sb.from("cuentas").insert(data);
    if(error){ showError("No se pudo guardar la cuenta: "+error.message); return; }
    hideError(); fCuenta.reset(); await fetchAll();
  };
  document.querySelectorAll("[data-del-mov]").forEach(b=>b.onclick=async ()=>{
    const {error} = await sb.from("movimientos").delete().eq("id", b.dataset.delMov);
    if(error){ showError("No se pudo borrar: "+error.message); return; }
    hideError(); await fetchAll();
  });
  document.querySelectorAll("[data-del-deuda]").forEach(b=>b.onclick=async ()=>{
    const {error} = await sb.from("deudas").delete().eq("id", b.dataset.delDeuda);
    if(error){ showError("No se pudo borrar: "+error.message); return; }
    hideError(); await fetchAll();
  });
  document.querySelectorAll("[data-del-cuenta]").forEach(b=>b.onclick=async ()=>{
    const {error} = await sb.from("cuentas").delete().eq("id", b.dataset.delCuenta);
    if(error){ showError("No se pudo borrar: "+error.message); return; }
    hideError(); await fetchAll();
  });
  document.querySelectorAll("[data-saldar]").forEach(b=>b.onclick=()=>{ saldarId = b.dataset.saldar; render(); });
  document.querySelectorAll("[data-cancelar-saldar]").forEach(b=>b.onclick=()=>{ saldarId = null; render(); });
  document.querySelectorAll("[data-confirmar-saldar]").forEach(b=>b.onclick=async ()=>{
    const deudaId = b.dataset.confirmarSaldar;
    const d = deudas.find(x=>x.id===deudaId);
    const sel = document.getElementById("saldarCuenta");
    if(!d || !sel || !sel.value) return;
    const tipo = d.direccion === "me_deben" ? "ingreso" : "gasto";
    const nota = `Saldo deuda: ${d.persona}${d.concepto? " — "+d.concepto : ""}`;
    const {error:e1} = await sb.from("movimientos").insert({tipo, categoria:"Deuda", importe:d.importe, fecha:today(), nota, cuenta_id:sel.value});
    if(e1){ showError("No se pudo guardar el pago: "+e1.message); return; }
    const {error:e2} = await sb.from("deudas").update({estado:"saldado"}).eq("id", deudaId);
    if(e2){ showError("Se guardó el pago pero no se pudo marcar la deuda como saldada: "+e2.message); return; }
    hideError(); saldarId = null; await fetchAll();
  });
  const fInversion = document.getElementById("fInversion");
  if(fInversion) fInversion.onsubmit = async (e)=>{
    e.preventDefault();
    const f = new FormData(fInversion);
    const data = {nombre:f.get("nombre"), tipo:f.get("tipo")||"", valor_actual:parseFloat(f.get("valorActual"))};
    const {error} = await sb.from("inversiones").insert(data);
    if(error){ showError("No se pudo guardar la inversión: "+error.message); return; }
    hideError(); fInversion.reset(); await fetchAll();
  };
  document.querySelectorAll("[data-del-inv]").forEach(b=>b.onclick=async ()=>{
    const {error} = await sb.from("inversiones").delete().eq("id", b.dataset.delInv);
    if(error){ showError("No se pudo borrar: "+error.message); return; }
    hideError(); await fetchAll();
  });
  document.querySelectorAll("[data-aportar-inv]").forEach(b=>b.onclick=()=>{ aportarInvId=b.dataset.aportarInv; editarValorInvId=null; render(); });
  document.querySelectorAll("[data-cancelar-aportar]").forEach(b=>b.onclick=()=>{ aportarInvId=null; render(); });
  document.querySelectorAll("[data-confirmar-aportar]").forEach(b=>b.onclick=async ()=>{
    const invId = b.dataset.confirmarAportar;
    const inv = inversiones.find(x=>x.id===invId);
    const importeEl = document.getElementById("aportarImporte");
    const cuentaEl = document.getElementById("aportarCuenta");
    const importe = parseFloat(importeEl?.value);
    if(!inv || !cuentaEl?.value || !importe || importe<=0) return;
    const {error:e1} = await sb.from("aportaciones_inversion").insert({inversion_id:invId, importe, fecha:today(), cuenta_id:cuentaEl.value});
    if(e1){ showError("No se pudo guardar la aportación: "+e1.message); return; }
    const {error:e2} = await sb.from("movimientos").insert({tipo:"gasto", categoria:"Inversión", importe, fecha:today(), nota:`Aportación: ${inv.nombre}`, cuenta_id:cuentaEl.value});
    if(e2){ showError("Se guardó la aportación pero no el gasto en la cuenta: "+e2.message); return; }
    hideError(); aportarInvId = null; await fetchAll();
  });
  document.querySelectorAll("[data-editar-valor]").forEach(b=>b.onclick=()=>{ editarValorInvId=b.dataset.editarValor; aportarInvId=null; render(); });
  document.querySelectorAll("[data-cancelar-valor]").forEach(b=>b.onclick=()=>{ editarValorInvId=null; render(); });
  document.querySelectorAll("[data-confirmar-valor]").forEach(b=>b.onclick=async ()=>{
    const invId = b.dataset.confirmarValor;
    const nuevo = parseFloat(document.getElementById("valorNuevo")?.value);
    if(isNaN(nuevo)) return;
    const {error} = await sb.from("inversiones").update({valor_actual:nuevo}).eq("id", invId);
    if(error){ showError("No se pudo guardar el nuevo valor: "+error.message); return; }
    hideError(); editarValorInvId = null; await fetchAll();
  });
}

async function fetchAll(){
  try{
    const [{data:cta, error:e1}, {data:mov, error:e2}, {data:deu, error:e3}, {data:inv, error:e4}, {data:apo, error:e5}] = await Promise.all([
      sb.from("cuentas").select("*").order("nombre"),
      sb.from("movimientos").select("*").order("fecha", {ascending:false}),
      sb.from("deudas").select("*"),
      sb.from("inversiones").select("*"),
      sb.from("aportaciones_inversion").select("*")
    ]);
    const err = e1||e2||e3||e4||e5;
    if(err){ ready = true; render(); showError("No se pudieron cargar los datos: "+err.message); return; }
    cuentas = (cta||[]).map(c=>({id:c.id, nombre:c.nombre, saldoInicial:Number(c.saldo_inicial)}));
    movimientos = (mov||[]).map(m=>({id:m.id, tipo:m.tipo, categoria:m.categoria, importe:Number(m.importe), fecha:m.fecha, nota:m.nota, cuentaId:m.cuenta_id}));
    deudas = (deu||[]).map(d=>({id:d.id, persona:d.persona, importe:Number(d.importe), direccion:d.direccion, concepto:d.concepto, estado:d.estado, fecha:d.fecha}));
    inversiones = (inv||[]).map(i=>({id:i.id, nombre:i.nombre, tipo:i.tipo, valorActual:Number(i.valor_actual)}));
    aportaciones = (apo||[]).map(a=>({id:a.id, inversionId:a.inversion_id, importe:Number(a.importe), fecha:a.fecha, cuentaId:a.cuenta_id}));
    hideError(); ready = true; render();
  }catch(e){
    ready = true; render();
    showError("No se han podido cargar los datos. Comprueba tu conexión e inténtalo de nuevo.");
  }
}

function applyAuthUI(){
  document.getElementById("authScreen").style.display = session ? "none" : "block";
  document.getElementById("appShell").style.display = session ? "block" : "none";
  if(session){
    const nombre = session.user.user_metadata?.full_name;
    document.getElementById("sesionInfo").textContent = nombre ? `Hola, ${nombre}` : session.user.email;
  }
}

async function startApp(){
  if(appStarted) return;
  appStarted = true;
  render();
  await fetchAll();
  sb.channel("cambios")
    .on("postgres_changes", {event:"*", schema:"public", table:"movimientos"}, fetchAll)
    .on("postgres_changes", {event:"*", schema:"public", table:"deudas"}, fetchAll)
    .on("postgres_changes", {event:"*", schema:"public", table:"cuentas"}, fetchAll)
    .on("postgres_changes", {event:"*", schema:"public", table:"inversiones"}, fetchAll)
    .on("postgres_changes", {event:"*", schema:"public", table:"aportaciones_inversion"}, fetchAll)
    .subscribe();
}

async function init(){
  if(!SUPABASE_URL.startsWith("http")){
    document.body.innerHTML = `<div class="status">Falta configurar SUPABASE_URL y SUPABASE_ANON_KEY en el código.</div>`;
    return;
  }
  document.getElementById("fLogin").onsubmit = async (e)=>{
    e.preventDefault();
    const email = document.getElementById("loginEmail").value;
    const nombre = document.getElementById("loginNombre").value;
    const msg = document.getElementById("loginMsg");
    msg.textContent = "Enviando...";
    const {error} = await sb.auth.signInWithOtp({email, options:{emailRedirectTo: window.location.href, data:{full_name: nombre}}});
    msg.textContent = error ? "Error: "+error.message : "Enlace enviado. Revisa tu correo y pulsa el enlace desde este mismo dispositivo.";
  };
  document.getElementById("btnLogout").onclick = ()=> sb.auth.signOut();

  const {data:{session:s}} = await sb.auth.getSession();
  session = s;
  applyAuthUI();
  if(session) startApp();

  sb.auth.onAuthStateChange((_event, s2)=>{
    session = s2;
    applyAuthUI();
    if(session) startApp();
  });
}
init();
</script>
</body>
</html>

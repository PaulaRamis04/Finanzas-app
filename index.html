<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuentas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%AA%99%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
<script>
// Personalización (tema, color, fondo, imagen): se aplica antes de pintar para que no parpadee.
const FONDOS = {crema:["#fdf7f2","#1c1718"], menta:["#eef8f3","#141f1b"], lavanda:["#f4f1fc","#1b1925"], rosa:["#fdf0f1","#221a1c"], cielo:["#eef5fc","#151b23"], blanco:["#ffffff","#141414"]};
function leerPersonalizacion(){
  let p = {}; try{ p = JSON.parse(localStorage.getItem("personalizacion")||"{}")||{}; }catch(e){}
  let img = null; try{ img = localStorage.getItem("fondoImagen"); }catch(e){}
  return {tema:p.tema||"auto", acento:p.acento||"", fondo:FONDOS[p.fondo] ? p.fondo : "crema", velo:p.velo==null ? 55 : p.velo, imagen:img};
}
function aplicarPersonalizacion(p){
  p = p || leerPersonalizacion();
  const r = document.documentElement, st = r.style;
  if(p.tema==="auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", p.tema);
  if(p.acento){
    st.setProperty("--accent", p.acento);
    st.setProperty("--accent-2", `color-mix(in srgb, ${p.acento} 82%, black)`);
    st.setProperty("--accent-soft", `color-mix(in srgb, ${p.acento} 20%, var(--card))`);
  } else ["--accent","--accent-2","--accent-soft"].forEach(v=>st.removeProperty(v));
  if(p.fondo!=="crema"){ st.setProperty("--paper-l", FONDOS[p.fondo][0]); st.setProperty("--paper-d", FONDOS[p.fondo][1]); }
  else { st.removeProperty("--paper-l"); st.removeProperty("--paper-d"); }
  if(p.imagen){ st.setProperty("--fondo-img", `url("${p.imagen}")`); st.setProperty("--velo", p.velo+"%"); r.classList.add("con-imagen"); }
  else { st.removeProperty("--fondo-img"); st.removeProperty("--velo"); r.classList.remove("con-imagen"); }
}
aplicarPersonalizacion();
</script>
<style>
:root{
  --ink:#4a3b3b; --paper:var(--paper-l,#fdf7f2); --line:#f0e4dc;
  --accent:#f07f76; --accent-2:#e66b62; --accent-soft:#fde6e3;
  --mint:#3fae92; --mint-soft:#e1f4ed; --lav-soft:#ece8fb; --peach-soft:#fdebd8;
  --pos:#2f9e7a; --neg:#e0556a; --muted:#9a8a86; --card:#ffffff; --on-accent:#fff;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#f5ecea; --paper:var(--paper-d,#1c1718); --line:#3a3132;
    --accent:#f59a92; --accent-2:#f8aea7; --accent-soft:#3d2826;
    --mint:#7fd6bb; --mint-soft:#1f3530; --lav-soft:#2b2740; --peach-soft:#3a2d20;
    --pos:#6fd3ad; --neg:#ff8a9a; --muted:#b3a4a1; --card:#262021; --on-accent:#2b1917;
  }
}
:root[data-theme="dark"]{
  --ink:#f5ecea; --paper:var(--paper-d,#1c1718); --line:#3a3132;
  --accent:#f59a92; --accent-2:#f8aea7; --accent-soft:#3d2826;
  --mint:#7fd6bb; --mint-soft:#1f3530; --lav-soft:#2b2740; --peach-soft:#3a2d20;
  --pos:#6fd3ad; --neg:#ff8a9a; --muted:#b3a4a1; --card:#262021; --on-accent:#2b1917;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  min-height:100%; -webkit-font-smoothing:antialiased;
}
header{padding:22px 16px 6px; max-width:640px; margin:0 auto}
.cab-fila{display:flex; justify-content:space-between; align-items:center; gap:12px}
header h1{margin:0; font-size:26px; font-weight:800; letter-spacing:-0.02em}
.icono-btn{width:42px; height:42px; border-radius:50%; border:none; background:var(--card); box-shadow:0 2px 10px rgba(74,59,59,.1); cursor:pointer; color:var(--ink); display:flex; align-items:center; justify-content:center; flex-shrink:0}
.icono-btn.girando svg{animation:girar .8s linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}
.periodo{display:flex; gap:8px; margin:14px 0}
.periodo select{width:auto; padding:8px 30px 8px 14px; font-size:13.5px; font-weight:700; border-radius:999px; border:none; background:var(--accent-soft); color:var(--accent); -webkit-appearance:none; appearance:none}
.pill-sel{position:relative; display:inline-flex}
.pill-sel::after{content:""; position:absolute; right:13px; top:50%; width:6px; height:6px; border:solid var(--accent); border-width:0 2.5px 2.5px 0; transform:translateY(-70%) rotate(45deg); pointer-events:none}
header .mini{margin-bottom:0}
.balance{display:flex; gap:24px; margin-top:18px; flex-wrap:wrap}
.balance div{min-width:98px}
.balance .num{font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-0.01em}
.balance .lbl{font-size:11.5px; color:var(--muted); margin-top:3px}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.menu-overlay{
  display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:20;
}
.menu-overlay.open{display:block}
.menu-panel{
  position:fixed; top:0; bottom:0; left:0; width:78%; max-width:300px; background:var(--card);
  z-index:21; padding:22px 16px; overflow-y:auto; transform:translateX(-100%); transition:transform .2s ease;
  padding-top:calc(22px + env(safe-area-inset-top,0px));
}
.menu-panel.open{transform:translateX(0)}
.menu-group-title{font-size:12px; font-weight:800; color:var(--muted); margin:18px 0 8px}
.menu-group-title:first-child{margin-top:0}
.menu-item{
  display:block; width:100%; text-align:left; background:none; border:none; padding:10px 8px;
  border-radius:10px; font-size:15px; font-weight:600; color:var(--ink); cursor:pointer;
}
.menu-item.active{background:var(--accent-soft); color:var(--accent)}
main{padding:12px 16px calc(100px + env(safe-area-inset-bottom,0px)); max-width:640px; margin:0 auto}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:22px; padding:18px;
  margin-bottom:16px; box-shadow:0 2px 10px rgba(20,20,30,.04);
}
form{display:grid; gap:11px}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
label{font-size:12px; color:var(--muted); display:block; margin-bottom:4px; font-weight:600}
input,select,textarea{
  width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:14px;
  background:var(--paper); color:var(--ink); font-size:15px; font-family:inherit;
}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--mint); background:var(--card)}
.btn{
  background:var(--accent); color:var(--on-accent); border:none; padding:12px 20px; font-family:inherit;
  border-radius:999px; font-size:14px; font-weight:700; cursor:pointer; transition:background .15s ease;
}
.btn:hover{background:var(--accent-2)}
.btn.ghost{background:transparent; color:var(--neg); border:1.5px solid var(--line); padding:7px 14px; font-size:12.5px; border-radius:999px}
.btn.ghost:hover{background:var(--paper)}
.btn.gold{background:var(--accent-soft); color:var(--accent)}
.btn.gold:hover{filter:brightness(1.04)}
.list{display:flex; flex-direction:column; gap:8px}
.item{
  display:flex; justify-content:space-between; align-items:center; gap:10px;
  padding:14px; border:1px solid var(--line); border-radius:18px; background:var(--card);
}
.item .meta{font-size:12px; color:var(--muted); margin-top:2px}
.meta{font-size:12px; color:var(--muted)}
.lado{background:var(--card); border:1.5px solid var(--line); border-radius:18px; padding:14px; cursor:pointer; text-align:left; -webkit-tap-highlight-color:transparent}
.lado .cifra{font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; margin:3px 0 1px; letter-spacing:-0.01em}
.lado.activo.pos{border-color:var(--pos); box-shadow:0 0 0 3px rgba(22,163,74,.16)}
.lado.activo.neg{border-color:var(--neg); box-shadow:0 0 0 3px rgba(225,29,72,.14)}
.grip{display:inline-flex; flex-direction:column; justify-content:center; gap:3px; padding:10px 8px; margin:-10px 0 -10px -8px; cursor:grab; touch-action:none; flex-shrink:0; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
.grip i{display:block; width:16px; height:2px; border-radius:2px; background:var(--muted)}
.grip:active{cursor:grabbing}
.sort-item{display:flex; flex-direction:column; gap:8px}
.sort-arrastrando{opacity:.35}
.sort-ghost{position:fixed; z-index:70; pointer-events:none; margin:0; box-shadow:0 14px 34px rgba(0,0,0,.3); border-radius:18px; background:var(--card); opacity:.97}
.item .amt{font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; font-size:15px}
.tag{font-size:11px; padding:3px 10px; border-radius:999px; background:var(--accent-soft); border:none; color:var(--accent); font-weight:600}
.empty{color:var(--muted); font-size:13px; text-align:center; padding:32px 10px}
h2{font-size:16px; margin:0 0 12px; font-weight:800}
.section-title{font-size:17px; font-weight:800; color:var(--ink); margin:24px 0 10px}
.status{font-size:12px; color:var(--muted); text-align:center; padding:6px}
.errbar{
  display:none; position:fixed; left:12px; right:12px; bottom:calc(84px + env(safe-area-inset-bottom,0px)); z-index:40;
  background:var(--neg); color:#fff; padding:12px 14px; font-size:13px; line-height:1.35;
  align-items:center; justify-content:space-between; gap:10px; border-radius:16px; box-shadow:0 6px 24px rgba(0,0,0,.28);
}
.errbar.show{display:flex}
.errbar .errbtns{display:flex; gap:6px; flex-shrink:0}
.errbar button{background:rgba(255,255,255,.22); color:#fff; border:none; padding:6px 12px; border-radius:999px; font-size:12px; cursor:pointer; white-space:nowrap}
[hidden]{display:none!important}
/* Acceso */
.auth{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 20px;
  background:radial-gradient(circle at 15% 10%, var(--accent-soft), transparent 45%), radial-gradient(circle at 90% 85%, var(--mint-soft), transparent 45%), var(--paper)}
.auth-box{width:100%; max-width:380px}
.auth-logo{font-size:64px; text-align:center; line-height:1}
.auth-marca{text-align:center; font-weight:800; font-size:20px; color:var(--accent); margin:6px 0 22px}
.auth h1{text-align:center; margin:0; font-size:28px; font-weight:800}
.auth-sub{text-align:center; margin:4px 0 24px; color:var(--muted)}
.auth form{gap:14px}
.auth label{font-size:14px; color:var(--ink); font-weight:600}
.campo{position:relative}
.campo input{padding:14px 44px 14px 42px; border:2px solid var(--mint-soft); border-radius:16px; font-size:16px; background:var(--card)}
.campo input:focus{outline:none; border-color:var(--mint)}
.campo .ico{position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none; display:flex}
.campo .ver{position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--muted); cursor:pointer; padding:6px; font-size:12px; font-weight:700; font-family:inherit}
.auth-link{background:none; border:none; padding:0; color:var(--mint); font-weight:700; font-size:14px; cursor:pointer; font-family:inherit}
.auth .btn{padding:15px; font-size:16px; box-shadow:0 6px 18px color-mix(in srgb, var(--accent) 35%, transparent)}
.auth-msg{text-align:center; font-size:14px; margin-top:14px; min-height:20px}
.auth-msg.error{color:var(--neg)}
.auth-pie{text-align:center; color:var(--muted); font-size:14px; margin-top:34px}
/* Navegación inferior */
.nav-inf{position:fixed; left:0; right:0; bottom:0; z-index:15; display:flex; justify-content:space-around;
  background:var(--card); border-top:1px solid var(--line); padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px)); box-shadow:0 -4px 18px rgba(74,59,59,.06)}
.nav-item{flex:1; max-width:110px; background:none; border:none; cursor:pointer; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:3px; font-size:11.5px; font-weight:700; font-family:inherit; padding:4px 0}
.nav-item svg{width:24px; height:24px}
.nav-item.active{color:var(--accent)}
#appShell.en-inicio header{display:none}
/* Inicio */
.hola{display:flex; justify-content:space-between; align-items:center; margin:4px 0 18px}
.hola h1{margin:0; font-size:26px; font-weight:800}
.campana{position:relative; width:42px; height:42px; border-radius:50%; border:none; background:var(--card); box-shadow:0 2px 10px rgba(74,59,59,.1); cursor:pointer; color:var(--ink); display:flex; align-items:center; justify-content:center}
.campana .punto{position:absolute; top:9px; right:10px; width:8px; height:8px; border-radius:50%; background:var(--accent)}
.saldo-lbl{font-size:16px; font-weight:600}
.saldo{display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap; margin:2px 0 14px}
.saldo .cifra{font-size:40px; font-weight:800; letter-spacing:-0.02em; color:var(--mint); font-variant-numeric:tabular-nums; line-height:1.1}
.saldo .var{font-size:14px; font-weight:700; padding-bottom:6px}
.mini{display:flex; gap:8px; overflow-x:auto; margin-bottom:16px; scrollbar-width:none}
.mini div{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:8px 12px; white-space:nowrap}
.mini b{display:block; font-size:14px; font-variant-numeric:tabular-nums}
.mini span{font-size:11px; color:var(--muted)}
.card.grafico{border:2px solid var(--mint-soft)}
.acciones{display:flex; justify-content:space-between; gap:6px; margin:4px 0 22px}
.accion{flex:1; background:none; border:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px; color:var(--ink); font-size:13px; font-weight:600; font-family:inherit}
.accion i{font-style:normal; width:54px; height:54px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:24px}
.tit-fila{display:flex; justify-content:space-between; align-items:baseline; margin:0 0 10px}
.tit-fila h2{margin:0}
/* Imagen de fondo personalizada, con un velo del color de fondo para que se lea bien */
html.con-imagen body::before{content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:linear-gradient(color-mix(in srgb, var(--paper) var(--velo,55%), transparent), color-mix(in srgb, var(--paper) var(--velo,55%), transparent)), var(--fondo-img) center/cover no-repeat}
html.con-imagen body{background:var(--paper)}
html.con-imagen .auth{background:transparent}
/* Personalización */
.opciones{display:flex; gap:8px; flex-wrap:wrap}
.opcion{flex:1; min-width:84px; border:2px solid var(--line); background:var(--card); color:var(--ink); border-radius:16px; padding:10px 8px; cursor:pointer; font-family:inherit; font-size:13px; font-weight:700; display:flex; flex-direction:column; align-items:center; gap:6px}
.opcion.sel{border-color:var(--accent); background:var(--accent-soft)}
.opcion .muestra{width:100%; height:34px; border-radius:10px; border:1px solid var(--line)}
.colores{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.color{width:40px; height:40px; border-radius:50%; border:3px solid var(--card); box-shadow:0 0 0 1.5px var(--line); cursor:pointer; padding:0}
.color.sel{box-shadow:0 0 0 2.5px var(--ink)}
.color-propio{position:relative; width:40px; height:40px; border-radius:50%; overflow:hidden; box-shadow:0 0 0 1.5px var(--line); background:conic-gradient(#f07f76,#f2a65a,#d9c441,#7cc26b,#3fae92,#5aa9e6,#8b7fd6,#e98bb5,#f07f76)}
.color-propio.sel{box-shadow:0 0 0 2.5px var(--ink)}
.color-propio input{position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; padding:0; border:none}
.vista-img{height:120px; border-radius:16px; background:var(--line) center/cover no-repeat; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px; font-weight:600}
input[type=range]{padding:0; border:none; background:none; accent-color:var(--accent)}
/* Filas tipo tarjeta (movimientos) */
.fila{display:flex; align-items:center; gap:12px; padding:10px 12px; background:var(--card); border:1px solid var(--line); border-radius:16px; width:100%; text-align:left; font-family:inherit; color:var(--ink); font-size:14px}
button.fila{cursor:pointer; -webkit-tap-highlight-color:transparent}
.fila .ico{width:40px; height:40px; border-radius:12px; background:var(--peach-soft); display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0}
.fila .ico.ing{background:var(--mint-soft)} .fila .ico.tr{background:var(--lav-soft)}
.fila .txt{flex:1; min-width:0}
.fila .txt b{display:block; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.fila .txt .meta{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.fila .der{text-align:right; flex-shrink:0}
.fila .der b{font-size:15px; font-variant-numeric:tabular-nums; white-space:nowrap}
.fila.abierta{border-color:var(--accent); border-bottom-left-radius:6px; border-bottom-right-radius:6px}
.fila-extra{background:var(--card); border:1px solid var(--accent); border-top:none; border-radius:0 0 16px 16px; margin-top:-9px; padding:12px; display:flex; flex-direction:column; gap:10px}
.fila-extra .meta{line-height:1.4}
.fila-extra label{margin-bottom:-6px}
.ico-cat{width:40px; height:40px; border-radius:12px; background:var(--peach-soft); display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{border:none; background:var(--accent-soft); color:var(--accent); font-family:inherit; font-size:12.5px; font-weight:700; padding:7px 12px; border-radius:999px; cursor:pointer}
.chip.ok{background:var(--mint-soft); color:var(--mint)} .chip.lav{background:var(--lav-soft); color:#7a6cc9}
.chip.peligro{background:transparent; color:var(--neg); border:1.5px solid var(--line)}
.dia{font-size:13px; font-weight:800; color:var(--muted); margin:16px 4px 8px; display:flex; justify-content:space-between}
.dia:first-child{margin-top:4px}
/* Buscador */
.buscador{display:flex; gap:8px; margin:6px 0 4px}
.buscar{position:relative; flex:1; min-width:0}
.buscar svg{position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none}
.buscar input{padding-left:38px; border-radius:999px; background:var(--card)}
.buscador select{width:auto; max-width:45%; border-radius:999px; background:var(--card)}
/* Tarjetas de cifras */
.stats{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px}
.stat{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:14px}
.stat i{font-style:normal; width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; margin-bottom:8px}
.stat b{display:block; font-size:20px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-0.01em}
.stat span{font-size:12px; color:var(--muted); font-weight:600}
.stat.ancha{grid-column:1/-1}
.barra{height:10px; background:var(--line); border-radius:999px; overflow:hidden}
.barra div{height:100%; border-radius:999px; background:var(--mint)}
/* Plegables (tarjetas de añadir) */
.pleg-cab{display:flex; align-items:center; gap:12px; cursor:pointer}
.pleg-cab i{font-style:normal; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:19px; flex-shrink:0}
.pleg-cab h2{flex:1; margin:0}
.pleg-cab .chev{color:var(--muted); transition:transform .2s ease; display:flex}
.pleg-cab.abierto .chev{transform:rotate(180deg)}
/* Categorías con barra */
.cat-fila{display:flex; align-items:center; gap:12px; width:100%; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:10px 12px; cursor:pointer; font-family:inherit; color:var(--ink); text-align:left}
.cat-fila.sel{border-color:var(--accent); background:var(--accent-soft)}
.cat-fila .ico{width:40px; height:40px; border-radius:12px; background:var(--peach-soft); display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0}
.cat-fila .txt{flex:1; min-width:0}
.cat-fila .top{display:flex; justify-content:space-between; gap:8px; font-size:14.5px; font-weight:700; margin-bottom:6px}
.cat-fila .barra{height:6px}
</style>
</head>
<body>
<div class="auth" id="authScreen" style="display:none">
  <div class="auth-box">
    <div class="auth-logo">🐷</div>
    <div class="auth-marca">Mis cuentas</div>
    <h1 id="authTitulo">¡Hola de nuevo!</h1>
    <p class="auth-sub" id="authSub">Entra para ver tus cuentas</p>
    <form id="fLogin">
      <div><label for="loginEmail">Email</label><div class="campo"><span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span><input type="email" id="loginEmail" required placeholder="tu@email.com" autocomplete="username"></div></div>
      <div><label for="loginPass">Contraseña</label><div class="campo"><span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span><input type="password" id="loginPass" required placeholder="••••••••" autocomplete="current-password"><button type="button" class="ver" data-ver>Ver</button></div></div>
      <div style="text-align:right;margin-top:-6px"><button type="button" class="auth-link" data-auth="olvido">¿Olvidaste tu contraseña?</button></div>
      <button class="btn" type="submit">Entrar</button>
    </form>
    <form id="fRegistro" hidden>
      <div><label for="regNombre">Tu nombre</label><div class="campo"><span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span><input type="text" id="regNombre" required placeholder="ej. Paula" autocomplete="given-name"></div></div>
      <div><label for="regEmail">Email</label><div class="campo"><span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span><input type="email" id="regEmail" required placeholder="tu@email.com" autocomplete="username"></div></div>
      <div><label for="regPass">Contraseña</label><div class="campo"><span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span><input type="password" id="regPass" required placeholder="Mínimo 8 caracteres" autocomplete="new-password" minlength="8"><button type="button" class="ver" data-ver>Ver</button></div></div>
      <button class="btn" type="submit">Crear cuenta</button>
    </form>
    <form id="fOlvido" hidden>
      <div><label for="olvEmail">Email</label><div class="campo"><span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span><input type="email" id="olvEmail" required placeholder="tu@email.com" autocomplete="username"></div></div>
      <button class="btn" type="submit">Enviar enlace</button>
    </form>
    <form id="fNuevaPass" hidden>
      <div><label for="nuevaPass">Nueva contraseña</label><div class="campo"><span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span><input type="password" id="nuevaPass" required placeholder="Mínimo 8 caracteres" autocomplete="new-password" minlength="8"><button type="button" class="ver" data-ver>Ver</button></div></div>
      <button class="btn" type="submit">Guardar contraseña</button>
    </form>
    <div class="auth-msg" id="loginMsg" role="status"></div>
    <p class="auth-pie" id="authPie"></p>
  </div>
</div>
<div id="appShell" style="display:none">
  <header>
    <div class="cab-fila">
      <h1 id="tabActual"></h1>
      <button class="icono-btn" id="btnRefrescar" aria-label="Actualizar" title="Actualizar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg></button>
    </div>
    <div class="periodo" id="periodoBox"></div>
    <div class="mini" id="balanceBox"></div>
    <p id="sesionInfo" hidden></p><button id="btnLogout" hidden>Cerrar sesión</button>
  </header>
  <div class="errbar" id="errBar"><span id="errMsg"></span><span class="errbtns"><button id="errRetry">Reintentar</button><button id="errClose">Cerrar</button></span></div>
  <div class="menu-overlay" id="menuOverlay"></div>
  <div class="menu-panel" id="menuPanel"></div>
  <main id="app"></main>
  <nav class="nav-inf" id="navInf">
    <button class="nav-item" data-nav="Inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
    <button class="nav-item" data-nav="Movimientos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/></svg>Movimientos</button>
    <button class="nav-item" data-nav="Cuentas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a1 1 0 0 1-1-1V6a2 2 0 0 1 2-2h11v3"/><circle cx="16" cy="13.5" r="1.2"/></svg>Cuentas</button>
    <button class="nav-item" data-nav="Resumen del mes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20v-6M12 20V5M19 20v-9"/></svg>Análisis</button>
    <button class="nav-item" id="navMas"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>Más</button>
  </nav>
</div>

<script src="js/state.js"></script>

<script src="js/views/cuentas.js"></script>
<script src="js/views/deudas.js"></script>
<script src="js/views/importar.js"></script>
<script src="js/views/inversiones.js"></script>
<script src="js/views/objetivos.js"></script>
<script src="js/views/proyeccion.js"></script>
<script src="js/views/recurrentes.js"></script>
<script src="js/views/categorias.js"></script>
<script src="js/views/preferencias.js"></script>
<script src="js/views/personalizacion.js"></script>
<script src="js/views/app.js"></script>
</body>
</html>

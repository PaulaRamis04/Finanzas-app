<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuentas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%AA%99%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --ink:#15161a; --paper:#ffffff; --line:#e7e7ec;
  --accent:#6c4ee3; --accent-2:#5a3fd0; --accent-soft:#efe9fd;
  --pos:#16a34a; --neg:#e11d48; --muted:#7c7c86; --card:#ffffff;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#f1f1f5; --paper:#121214; --line:#2b2b30;
    --accent:#a494f5; --accent-2:#b7abf7; --accent-soft:#26203f;
    --pos:#4ade80; --neg:#fb7185; --muted:#9c9ca6; --card:#1b1b1f;
  }
}
:root[data-theme="dark"]{
  --ink:#f1f1f5; --paper:#121214; --line:#2b2b30;
  --accent:#a494f5; --accent-2:#b7abf7; --accent-soft:#26203f;
  --pos:#4ade80; --neg:#fb7185; --muted:#9c9ca6; --card:#1b1b1f;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  min-height:100%; -webkit-font-smoothing:antialiased;
}
header{
  padding:26px 20px 18px; border-bottom:1px solid var(--line);
  position:sticky; top:env(safe-area-inset-top,0px); background:var(--paper); z-index:5;
}
header h1{margin:0 0 3px; font-size:24px; font-weight:800; letter-spacing:-0.02em}
header p{margin:0; color:var(--muted); font-size:13px}
.periodo{display:flex; gap:8px; margin-top:14px}
.periodo select{width:auto; padding:7px 12px; font-size:13px; border-radius:999px}
.balance{display:flex; gap:24px; margin-top:18px; flex-wrap:wrap}
.balance div{min-width:98px}
.balance .num{font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-0.01em}
.balance .lbl{font-size:11.5px; color:var(--muted); margin-top:3px}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.topbar{display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line)}
.menu-btn{background:none; border:none; cursor:pointer; padding:6px; display:flex; flex-direction:column; gap:4px}
.menu-btn span{display:block; width:20px; height:2px; background:var(--ink); border-radius:2px}
.tab-actual{font-weight:800; font-size:14px}
.menu-overlay{
  display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:20;
}
.menu-overlay.open{display:block}
.menu-panel{
  position:fixed; top:0; bottom:0; left:0; width:78%; max-width:300px; background:var(--card);
  z-index:21; padding:22px 16px; overflow-y:auto; transform:translateX(-100%); transition:transform .2s ease;
  padding-top:calc(22px + env(safe-area-inset-top,0px));
}
.menu-panel.open{transform:translateX(0)}
.menu-group-title{font-size:12px; font-weight:800; color:var(--muted); margin:18px 0 8px}
.menu-group-title:first-child{margin-top:0}
.menu-item{
  display:block; width:100%; text-align:left; background:none; border:none; padding:10px 8px;
  border-radius:10px; font-size:15px; font-weight:600; color:var(--ink); cursor:pointer;
}
.menu-item.active{background:var(--accent-soft); color:var(--accent)}
main{padding:20px 16px 64px; max-width:640px; margin:0 auto}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:22px; padding:18px;
  margin-bottom:16px; box-shadow:0 2px 10px rgba(20,20,30,.04);
}
form{display:grid; gap:11px}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
label{font-size:12px; color:var(--muted); display:block; margin-bottom:4px; font-weight:600}
input,select{
  width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:12px;
  background:var(--paper); color:var(--ink); font-size:14px; font-family:inherit;
}
input:focus,select:focus{outline:2px solid var(--accent); outline-offset:1px}
.btn{
  background:var(--accent); color:#fff; border:none; padding:11px 18px;
  border-radius:999px; font-size:14px; font-weight:700; cursor:pointer; transition:background .15s ease;
}
.btn:hover{background:var(--accent-2)}
.btn.ghost{background:transparent; color:var(--neg); border:1px solid var(--line); padding:6px 13px; font-size:12.5px; border-radius:999px}
.btn.ghost:hover{background:var(--paper)}
.btn.gold{background:var(--accent-soft); color:var(--accent)}
.btn.gold:hover{filter:brightness(1.04)}
.list{display:flex; flex-direction:column; gap:8px}
.item{
  display:flex; justify-content:space-between; align-items:center; gap:10px;
  padding:13px 14px; border:1px solid var(--line); border-radius:16px; background:var(--card);
}
.item .meta{font-size:12px; color:var(--muted); margin-top:2px}
.meta{font-size:12px; color:var(--muted)}
.item .amt{font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; font-size:15px}
.tag{font-size:11px; padding:3px 10px; border-radius:999px; background:var(--accent-soft); border:none; color:var(--accent); font-weight:600}
.empty{color:var(--muted); font-size:13px; text-align:center; padding:32px 10px}
h2{font-size:16px; margin:0 0 12px; font-weight:800}
.section-title{font-size:13px; font-weight:800; color:var(--accent); letter-spacing:.01em; margin:22px 0 9px}
.status{font-size:12px; color:var(--muted); text-align:center; padding:6px}
.errbar{
  display:none; position:fixed; left:12px; right:12px; bottom:calc(14px + env(safe-area-inset-bottom,0px)); z-index:40;
  background:var(--neg); color:#fff; padding:12px 14px; font-size:13px; line-height:1.35;
  align-items:center; justify-content:space-between; gap:10px; border-radius:16px; box-shadow:0 6px 24px rgba(0,0,0,.28);
}
.errbar.show{display:flex}
.errbar .errbtns{display:flex; gap:6px; flex-shrink:0}
.errbar button{background:rgba(255,255,255,.22); color:#fff; border:none; padding:6px 12px; border-radius:999px; font-size:12px; cursor:pointer; white-space:nowrap}
</style>
</head>
<body>
<div class="card" id="authScreen" style="max-width:420px;margin:60px auto;display:none">
  <h2>Inicia sesión</h2>
  <p class="meta">Te enviamos un enlace a tu correo, sin contraseña que recordar.</p>
  <form id="fLogin">
    <label>Tu nombre</label>
    <input type="text" id="loginNombre" required placeholder="ej. Adrián">
    <label>Email</label>
    <input type="email" id="loginEmail" required placeholder="tu@email.com">
    <button class="btn" type="submit">Enviar enlace</button>
  </form>
  <div id="loginMsg" class="meta" style="margin-top:8px"></div>
</div>
<div id="appShell" style="display:none">
  <header>
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div><h1>Tus cuentas</h1><p id="sesionInfo" style="margin:0;color:var(--muted);font-size:12px"></p></div>
      <button class="btn ghost" id="btnLogout">Cerrar sesión</button>
    </div>
    <div class="balance" id="balanceBox"></div>
    <div class="periodo" id="periodoBox"></div>
  </header>
  <div class="errbar" id="errBar"><span id="errMsg"></span><span class="errbtns"><button id="errRetry">Reintentar</button><button id="errClose">Cerrar</button></span></div>
  <div class="topbar">
    <button class="menu-btn" id="menuBtn" aria-label="Menú"><span></span><span></span><span></span></button>
    <span class="tab-actual" id="tabActual"></span>
    <button class="btn ghost" id="btnRefrescar" style="margin-left:auto;color:var(--accent)">Actualizar</button>
  </div>
  <div class="menu-overlay" id="menuOverlay"></div>
  <div class="menu-panel" id="menuPanel"></div>
  <main id="app"></main>
</div>
<script>
const TABS = ["Gastos","Resumen del mes","Presupuestos","Movimientos","Cuentas","Deudas","Importar","Inversiones","Objetivos","Categorías","Preferencias"];
const GRUPOS_MENU = [
  {nombre:"Resumen", tabs:["Gastos","Resumen del mes","Presupuestos"]},
  {nombre:"Movimientos", tabs:["Movimientos","Cuentas","Deudas","Importar"]},
  {nombre:"Ahorro", tabs:["Inversiones","Objetivos"]},
  {nombre:"Ajustes", tabs:["Categorías","Preferencias"]}
];
let tab = "Gastos";
let ready = false;
let movimientos = [], deudas = [], cuentas = [], inversiones = [], aportaciones = [], categorias = [], retiros = [], presupuestos = [], objetivos = [];
let editarPresupuestoId = null, editarPresDeudaId = null, meDebenMovId = null;
let catsContraidas = {};
try{ catsContraidas = JSON.parse(localStorage.getItem("catsContraidas") || "{}") || {}; }catch(e){ catsContraidas = {}; }
let cuentaDefecto = "";
try{ cuentaDefecto = localStorage.getItem("cuentaDefecto") || ""; }catch(e){}
let csvHeaders = [], csvFilas = [], csvPreview = [], csvSel = {}, csvPreviewCuentaId = "";
let pendientes = [], pendCats = {};
let aportarInvId = null, editarValorInvId = null, editarCatId = null, verAportacionesId = null, ajustarSaldoId = null, rescatarInvId = null;
let expandidaInvId = null, editarInfoInvId = null, resumenSel = null, resumenAhorroAbierto = false;
let gruposAbiertos = {}, modoOrdenInv = false, rentasInvId = null, modoOrdenCuentas = false, modoOrdenObjetivos = false;
const PALETTE = ["#1f4d43","#c08a2e","#a3402f","#5c9683","#7fb8a6","#e0ac4e","#8a6d3b","#3f6b52","#b5651d","#4a7c94"];
let session = null, appStarted = false;

// --- Configura aquí tu proyecto de Supabase ---
const SUPABASE_URL = "https://qlgtgmgtijjzqwxkhwdg.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFsZ3RnbWd0aWpqenF3eGtod2RnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNDU1OTcsImV4cCI6MjEwNTgyMTU5N30.HZx4Sh-gic5ZG7i80utcShW_Jxwa20dATo0kdvIwoIA";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const CATEGORIAS_DEFECTO = [
  {tipo:"gasto", padre:"Imprescindible", nombre:"Gasolina"},
  {tipo:"gasto", padre:"Imprescindible", nombre:"Academia"},
  {tipo:"gasto", padre:"Prescindible", nombre:"Salidas"},
  {tipo:"gasto", padre:"Prescindible", nombre:"Tomar algo"},
  {tipo:"gasto", padre:"Prescindible", nombre:"Comer"},
  {tipo:"gasto", padre:"Prescindible", nombre:"Compras"},
  {tipo:"gasto", padre:"Prescindible", nombre:"Suscripciones"},
  {tipo:"ingreso", padre:null, nombre:"Nómina"},
  {tipo:"ingreso", padre:null, nombre:"Extra"},
  {tipo:"ingreso", padre:null, nombre:"Bizum"},
  {tipo:"ingreso", padre:null, nombre:"Otro"}
];
const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
let periodoMes = String(new Date().getMonth()+1); // "todos" o "1".."12"; por defecto el mes actual
let periodoAnio = new Date().getFullYear();
let saldarId = null; // deuda que se está saldando ahora mismo

async function conCarga(btn, textoCarga, fn){
  if(!btn || btn.disabled) return;
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = textoCarga;
  try{
    await fn();
  } finally {
    if(document.body.contains(btn)){
      btn.disabled = false;
      btn.textContent = original;
    }
  }
}

let pendienteEnfoque = null;
function showError(msg){
  const bar = document.getElementById("errBar");
  document.getElementById("errMsg").textContent = msg;
  bar.classList.add("show");
  document.getElementById("errRetry").onclick = ()=>{ hideError(); fetchAll(); };
  document.getElementById("errClose").onclick = hideError;
}
function hideError(){ document.getElementById("errBar").classList.remove("show"); }

function eur(n){ return (n<0?"-":"") + "€" + Math.abs(n).toFixed(2).replace(".",","); }
function esc(s){
  if(s==null) return "";
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function today(){ const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function enPeriodo(fecha){
  if(!fecha) return false;
  const [y,m] = fecha.split("-");
  if(Number(y) !== periodoAnio) return false;
  return periodoMes==="todos" ? true : Number(m)===Number(periodoMes);
}

function renderPeriodo(){
  const years = Array.from(new Set([...movimientos.map(m=>Number((m.fecha||"").slice(0,4))).filter(Boolean), periodoAnio])).sort((a,b)=>b-a);
  document.getElementById("periodoBox").innerHTML = `
    <select id="selMes">
      <option value="todos" ${periodoMes==="todos"?"selected":""}>Total del año</option>
      ${MESES.map((m,i)=>`<option value="${i+1}" ${periodoMes===String(i+1)?"selected":""}>${m}</option>`).join("")}
    </select>
    <select id="selAnio">${years.map(y=>`<option value="${y}" ${y===periodoAnio?"selected":""}>${y}</option>`).join("")}</select>
  `;
  document.getElementById("selMes").onchange = e=>{periodoMes=e.target.value; render();};
  document.getElementById("selAnio").onchange = e=>{periodoAnio=Number(e.target.value); render();};
}

function closeMenu(){
  document.getElementById("menuPanel")?.classList.remove("open");
  document.getElementById("menuOverlay")?.classList.remove("open");
}
function renderTabs(){
  document.getElementById("tabActual").textContent = tab;
  document.getElementById("menuPanel").innerHTML = GRUPOS_MENU.map(g=>`
    <div class="menu-group-title">${g.nombre}</div>
    ${g.tabs.map(t=>`<button class="menu-item ${t===tab?'active':''}" data-tab="${t}">${t}${t==="Importar" && pendientes.length? ` (${pendientes.length})` : ""}</button>`).join("")}
  `).join("");
  document.querySelectorAll(".menu-item").forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; closeMenu(); render(); });
  const menuBtn = document.getElementById("menuBtn");
  const overlay = document.getElementById("menuOverlay");
  if(menuBtn) menuBtn.onclick = ()=>{
    document.getElementById("menuPanel").classList.add("open");
    overlay.classList.add("open");
  };
  if(overlay) overlay.onclick = closeMenu;
  const rb = document.getElementById("btnRefrescar");
  if(rb) rb.onclick = ()=>conCarga(rb, "Actualizando…", async ()=>{ await fetchAll(); });
}

function renderBalance(){
  const enP = movimientosEfectivos();
  const ingresos = enP.filter(m=>m.tipo==="ingreso").reduce((s,m)=>s+m.importe,0);
  const ahorro = enP.filter(m=>m.tipo==="gasto" && m.categoria==="Inversión").reduce((s,m)=>s+m.importe,0);
  const gastado = enP.filter(m=>m.tipo==="gasto" && m.categoria!=="Inversión").reduce((s,m)=>s+m.importe,0);
  const disponible = (ingresos - ahorro) - gastado;
  const meDeben = deudas.filter(d=>d.direccion==="me_deben" && d.estado==="pendiente").reduce((s,d)=>s+d.importe,0);
  const debo = deudas.filter(d=>d.direccion==="debo" && d.estado==="pendiente").reduce((s,d)=>s+d.importe,0);
  const totalCuentas = cuentas.reduce((s,c)=>s+saldoCuenta(c),0);
  const totalInversiones = inversiones.filter(i=>i.estado==="activa").reduce((s,i)=>s+i.valorActual,0);
  const patrimonioNeto = totalCuentas + totalInversiones + meDeben - debo;
  const lbl = periodoMes==="todos" ? `Año ${periodoAnio}` : `${MESES[Number(periodoMes)-1]} ${periodoAnio}`;
  document.getElementById("balanceBox").innerHTML = `
    <div><div class="num pos">${eur(ingresos)}</div><div class="lbl">Ingresos · ${lbl}</div></div>
    <div><div class="num ${disponible>=0?'pos':'neg'}">${eur(disponible)}</div><div class="lbl">Disponible para gastar</div></div>
    <div><div class="num ${patrimonioNeto>=0?'pos':'neg'}">${eur(patrimonioNeto)}</div><div class="lbl">Patrimonio neto</div></div>
    <div><div class="num pos">${eur(meDeben)}</div><div class="lbl">Me deben (total)</div></div>
    <div><div class="num neg">${eur(debo)}</div><div class="lbl">Debo (total)</div></div>
  `;
}

function cuentaNombre(id){ const c = cuentas.find(c=>c.id===id); return c? esc(c.nombre) : "Sin cuenta"; }
function cuentaPorDefecto(){ return cuentas.some(c=>c.id===cuentaDefecto) ? cuentaDefecto : ""; }
function opcionesCuentas(selectedId, sinDefecto){
  const sel = selectedId || (sinDefecto ? "" : cuentaPorDefecto());
  return cuentas.map(c=>`<option value="${c.id}"${c.id===sel?" selected":""}>${esc(c.nombre)}</option>`).join("");
}
function aportadoInv(inv){ return (inv.valorInicial||0) + aportaciones.filter(a=>a.inversionId===inv.id).reduce((s,a)=>s+a.importe,0); }
function retiradoInv(inv){ return retiros.filter(r=>r.inversionId===inv.id).reduce((s,r)=>s+r.importe,0); }
function beneficioInv(inv){ return (inv.valorActual + retiradoInv(inv)) - aportadoInv(inv); }
function saldoCuenta(c){
  const ing = movimientos.filter(m=>m.cuentaId===c.id && m.tipo==="ingreso").reduce((s,m)=>s+m.importe,0);
  const gas = movimientos.filter(m=>m.cuentaId===c.id && m.tipo==="gasto").reduce((s,m)=>s+m.importe,0);
  return (c.saldoInicial||0) + ing - gas;
}

function desglosePorCategoria(lista){
  const map = {};
  lista.forEach(m=>{ map[m.categoria] = (map[m.categoria]||0) + m.importe; });
  const total = lista.reduce((s,m)=>s+m.importe,0);
  return Object.entries(map).sort((a,b)=>b[1]-a[1]).map(([categoria,tot],i)=>({
    categoria, total:tot, color: PALETTE[i%PALETTE.length], pct: total? (tot/total*100) : 0
  }));
}
function pieStyle(desc){
  const total = desc.reduce((s,d)=>s+d.total,0);
  if(!total) return "var(--line)";
  let acc = 0;
  return desc.map(d=>{
    const start = acc/total*360; acc += d.total; const end = acc/total*360;
    return `${d.color} ${start}deg ${end}deg`;
  }).join(", ");
}
function bloqueGraficaCategoria(titulo, desc, tipo){
  if(!desc.length) return `<div class="card"><p class="meta" style="margin:0">Sin movimientos en este periodo.</p></div>`;
  const totalGrafica = desc.reduce((sum,d)=>sum+d.total,0);
  return `
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">
      <h2 style="margin:0">${titulo}</h2>
      <strong style="font-size:15px;font-variant-numeric:tabular-nums">${eur(totalGrafica)}</strong>
    </div>
    <div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-top:10px">
      <div style="width:130px;height:130px;border-radius:50%;background:conic-gradient(${pieStyle(desc)});flex-shrink:0;position:relative">
        <div style="position:absolute;inset:30px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;text-align:center">${eur(totalGrafica)}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:2px;flex:1;min-width:180px">
        ${desc.map(d=>`
          <button data-resumen-sel="${tipo}|${esc(d.categoria)}" style="display:flex;align-items:center;gap:8px;background:none;border:none;padding:5px 0;cursor:pointer;text-align:left;color:var(--ink);font-family:inherit;font-size:13px;width:100%">
            <span style="width:12px;height:12px;border-radius:50%;background:${d.color};flex-shrink:0"></span>
            <span style="flex:1">${esc(d.categoria)}</span>
            <span class="meta" style="white-space:nowrap">${eur(d.total)} · ${d.pct.toFixed(0)}%</span>
          </button>`).join("")}
      </div>
    </div>
  </div>`;
}
function renderResumen(){
  const enP = movimientosEfectivos();
  const ingresosList = enP.filter(m=>m.tipo==="ingreso");
  const ahorroList = enP.filter(m=>m.tipo==="gasto" && m.categoria==="Inversión");
  const gastosList = enP.filter(m=>m.tipo==="gasto" && m.categoria!=="Inversión" && m.importe>0);
  const descIngresos = desglosePorCategoria(ingresosList);
  const descGastos = desglosePorCategoria(gastosList);
  const totalAhorro = ahorroList.reduce((s,m)=>s+m.importe,0);
  const lbl = periodoMes==="todos" ? `Año ${periodoAnio}` : `${MESES[Number(periodoMes)-1]} ${periodoAnio}`;

  let detalle = "";
  if(resumenSel){
    const lista = (resumenSel.tipo==="ingreso"?ingresosList:gastosList).filter(m=>m.categoria===resumenSel.categoria);
    const desc = resumenSel.tipo==="ingreso"?descIngresos:descGastos;
    const info = desc.find(d=>d.categoria===resumenSel.categoria);
    if(lista.length && info){
      detalle = `
      <div class="card">

function parseCSV(texto){
  const lineas = texto.split(/\r?\n/).filter(l=>l.trim().length);
  const splitLinea = (linea, delim)=>{
    const out = []; let cur=""; let enComillas=false;
    for(let i=0;i<linea.length;i++){
      const ch = linea[i];
      if(ch==='"'){ enComillas = !enComillas; }
      else if(ch===delim && !enComillas){ out.push(cur); cur=""; }
      else cur += ch;
    }
    out.push(cur);
    return out.map(x=>x.trim());
  };
  let best = null;
  [";",",","\t"].forEach(d=>{
    const freq = {};
    lineas.slice(0,50).forEach(l=>{ const n = splitLinea(l,d).length; freq[n]=(freq[n]||0)+1; });
    let modo = 1, f = 0;
    Object.entries(freq).forEach(([c,n])=>{ if(Number(c)>1 && n>f){ modo=Number(c); f=n; } });
    if(!best || f>best.f) best = {d, modo, f};
  });
  const delim = best ? best.d : ",";
  const modo = best && best.f ? best.modo : 1;
  const filas = lineas.map(l=>splitLinea(l, delim));
  let h = filas.findIndex(f=>f.length===modo && f.every(c=>c.length>0));
  if(h<0) h = filas.findIndex(f=>f.length===modo);
  if(h<0) h = 0;
  return {headers: filas[h]||[], filas: filas.slice(h+1).filter(f=>f.length>1)};
}
function parseImporteCSV(str){
  if(str==null) return NaN;
  let s = String(str).trim().replace(/[€\s]/g,"");
  if(s.includes(",") && s.includes(".")) s = s.replace(/\./g,"").replace(",", ".");
  else if(s.includes(",")) s = s.replace(",", ".");
  return parseFloat(s);
}
function parseFechaCSV(str){
  if(!str) return null;
  const s = String(str).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4}|\d{2})/);
  if(m){ let y = m[3]; if(y.length===2) y = "20"+y; return `${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`; }
  return s;
}
function sugerirCategoria(desc, tipo){
  if(!desc) return "";
  const d = desc.trim().toLowerCase();
  const m = movimientos.find(x=>x.tipo===tipo && (x.nota||"").trim().toLowerCase()===d
    && !["Inversión","Ajuste","Deuda"].includes(x.categoria)
    && categorias.some(c=>c.tipo===tipo && c.nombre===x.categoria));
  return m ? m.categoria : "";
}

function calcularPreview(){
  const iFecha = csvHeaders.indexOf(csvSel.fecha);
  const iImporte = csvHeaders.indexOf(csvSel.importe);
  const iNota = csvSel.nota ? csvHeaders.indexOf(csvSel.nota) : -1;
  const iSaldo = csvSel.saldo ? csvHeaders.indexOf(csvSel.saldo) : -1;
  const cuentaId = csvSel.cuenta;
  const cntP = new Map(), cntM = new Map();
  const add = (mp,k)=>mp.set(k,(mp.get(k)||0)+1);
  pendientes.filter(p=>p.cuentaId===cuentaId).forEach(p=>add(cntP, `${p.fecha}|${p.tipo}|${p.importe.toFixed(2)}|${p.descripcion}|${p.saldo!=null?p.saldo.toFixed(2):""}`));
  movimientos.filter(m=>m.cuentaId===cuentaId).forEach(m=>add(cntM, `${m.fecha}|${m.tipo}|${m.importe.toFixed(2)}|${m.nota||""}`));
  csvPreview = csvFilas.map((fila,idx)=>{
    const imp = parseImporteCSV(fila[iImporte]);
    if(isNaN(imp) || imp===0) return null;
    const saldoRaw = iSaldo>=0 ? parseImporteCSV(fila[iSaldo]) : NaN;
    const r = {
      fecha: parseFechaCSV(fila[iFecha]) || "", importe: Math.round(Math.abs(imp)*100)/100,
      tipo: imp<0 ? "gasto" : "ingreso", nota: iNota>=0 ? (fila[iNota]||"") : "",
      saldo: isNaN(saldoRaw) ? null : saldoRaw, posicion: idx, dup:false, invalida:false
    };
    r.invalida = !/^\d{4}-\d{2}-\d{2}$/.test(r.fecha);
    const kP = `${r.fecha}|${r.tipo}|${r.importe.toFixed(2)}|${r.nota}|${r.saldo!=null?r.saldo.toFixed(2):""}`;
    const kM = `${r.fecha}|${r.tipo}|${r.importe.toFixed(2)}|${r.nota}`;
    if((cntP.get(kP)||0)>0){ cntP.set(kP, cntP.get(kP)-1); r.dup = true; }
    else if((cntM.get(kM)||0)>0){ cntM.set(kM, cntM.get(kM)-1); r.dup = true; }
    return r;
  }).filter(Boolean);
  csvPreviewCuentaId = cuentaId;
}

// Cuánto de cada gasto está cubierto por otros: deudas "me deben" pendientes vinculadas
// + reembolsos ya cobrados de ese gasto.
function cubiertoPorMovimiento(){
  const c = {};
  deudas.filter(d=>d.estado==="pendiente" && d.movimientoId && d.direccion==="me_deben")
    .forEach(d=>{ c[d.movimientoId] = (c[d.movimientoId]||0) + d.importe; });
  movimientos.filter(m=>m.reembolsoDe && m.tipo==="ingreso")
    .forEach(m=>{ c[m.reembolsoDe] = (c[m.reembolsoDe]||0) + m.importe; });
  return c;
}
// Movimientos del periodo tal y como cuentan para TU gasto/ingreso: sin ajustes, sin
// reembolsos, y con los gastos rebajados por la parte que te deben o te han devuelto.
function movimientosEfectivos(){
  const cub = cubiertoPorMovimiento();
  const out = [];
  movimientos.forEach(m=>{
    if(!enPeriodo(m.fecha) || m.categoria==="Ajuste" || m.reembolsoDe) return;
    if(m.tipo==="gasto" && cub[m.id]){
      const cubierto = Math.min(m.importe, cub[m.id]);
      out.push({...m, importe: Math.round((m.importe-cubierto)*100)/100, importeOriginal: m.importe, cubierto});
    } else out.push(m);
  });
  return out;
}

function renderGastos(){
  const enP = movimientosEfectivos();
  const ingresos = enP.filter(m=>m.tipo==="ingreso").reduce((s,m)=>s+m.importe,0);
  const ahorro = enP.filter(m=>m.tipo==="gasto" && m.categoria==="Inversión").reduce((s,m)=>s+m.importe,0);
  const disponible = ingresos - ahorro;
  const gastosReales = enP.filter(m=>m.tipo==="gasto" && m.categoria!=="Inversión" && m.importe>0);
  const gastado = gastosReales.reduce((s,m)=>s+m.importe,0);
  const restante = disponible - gastado;
  const porCategoria = {};
  gastosReales.forEach(m=>{ porCategoria[m.categoria] = (porCategoria[m.categoria]||0) + m.importe; });
  const lbl = periodoMes==="todos" ? `Año ${periodoAnio}` : `${MESES[Number(periodoMes)-1]} ${periodoAnio}`;
  return `
  <div class="card">
    <h2>Disponible para gastar · ${lbl}</h2>
    <p class="meta" style="margin:4px 0 0">Ingresos menos lo que aportas a inversiones (tu ahorro del mes)</p>
    <div class="balance" style="margin-top:14px">
      <div><div class="num pos">${eur(ingresos)}</div><div class="lbl">Ingresos</div></div>
      <div><div class="num neg">${eur(ahorro)}</div><div class="lbl">Ahorro (inversiones)</div></div>
      <div><div class="num">${eur(disponible)}</div><div class="lbl">Disponible</div></div>
    </div>
  </div>
  <div class="card">
    <div class="balance">
      <div><div class="num neg">${eur(gastado)}</div><div class="lbl">Gastado</div></div>
      <div><div class="num ${restante>=0?'pos':'neg'}">${eur(restante)}</div><div class="lbl">Te queda</div></div>
    </div>
  </div>
  <div class="section-title">Por categoría</div>
  <div class="list">
    ${Object.keys(porCategoria).length? Object.entries(porCategoria).sort((a,b)=>b[1]-a[1]).map(([cat,total])=>`
      <div class="item"><div>${esc(cat)}</div><div class="amt neg">${eur(total)}</div></div>
    `).join("") : `<div class="empty">Sin gastos en este periodo.</div>`}
  </div>
  <div class="section-title">Movimientos de gasto (${gastosReales.length})</div>
  <div class="list">
    ${gastosReales.length? [...gastosReales].sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(m=>`
      <div class="item">
        <div><span class="tag">${esc(m.categoria)}</span>${m.nota?`<div class="meta">${esc(m.nota)}</div>`:""}<div class="meta">${m.fecha}</div>${m.cubierto?`<div class="meta">De ${eur(m.importeOriginal)}; ${eur(m.cubierto)} cubiertos por deudas</div>`:""}</div>
        <div class="amt neg">-${eur(m.importe)}</div>
      </div>`).join("") : `<div class="empty">Sin movimientos de gasto en este periodo.</div>`}
  </div>`;
}

function siguienteOrdenLista(l){ return Math.max(0, ...l.map(x=>x.orden||0)) + 1; }
function flechasLista(tipo, id, k, n){
  if(n<2) return "";
  return `<div style="display:flex;gap:6px;margin-top:12px">${k>0?`<button class="btn ghost" data-mover-${tipo}="${id}|up">▲ Subir</button>`:""}${k<n-1?`<button class="btn ghost" data-mover-${tipo}="${id}|down">▼ Bajar</button>`:""}</div>`;
}
function botonOrdenar(tipo, activo, n){
  if(n<2) return "";
  return `<div style="display:flex;justify-content:flex-end;margin-bottom:10px"><button class="btn ghost" data-toggle-orden-${tipo}="1" style="color:var(--accent)">${activo?"Listo":"Ordenar"}</button></div>`;
}
async function moverEnLista(lista, rpcNombre, valor){
  const [id,dir] = valor.split("|");
  const l = [...lista].sort(porOrden);
  const idx = l.findIndex(x=>x.id===id);
  const j = idx + (dir==="up" ? -1 : 1);
  if(idx<0 || j<0 || j>=l.length) return;
  const ids = l.map(x=>x.id);
  [ids[idx], ids[j]] = [ids[j], ids[idx]];
  const {error} = await sb.rpc(rpcNombre, {p_ids: ids});
  if(error){ showError("No se pudo cambiar el orden: "+error.message); return; }
  hideError(); await fetchAll();
}
function porOrden(a,b){ return ((a.orden||0)-(b.orden||0)) || a.nombre.localeCompare(b.nombre); }
function grupos(){ return inversiones.filter(i=>i.esGrupo).sort(porOrden); }
function hijosDe(g){ return inversiones.filter(i=>i.padreId===g.id && !i.esGrupo).sort(porOrden); }
function valorGrupo(g){ return hijosDe(g).filter(h=>h.estado==="activa").reduce((s,h)=>s+h.valorActual,0); }
function beneficioGrupo(g){ return hijosDe(g).filter(h=>h.estado==="activa").reduce((s,h)=>s+beneficioInv(h),0); }
function rentasGrupo(g){ return hijosDe(g).reduce((s,h)=>s+(h.rentas||0),0); }
function siguienteOrden(){ return Math.max(0, ...inversiones.map(i=>i.orden||0)) + 1; }
function opcionesGrupos(selectedId){
  return grupos().map(g=>`<option value="${g.id}"${g.id===selectedId?" selected":""}>${esc(g.nombre)}</option>`).join("");
}
function listaHermanos(x){
  if(x.padreId){ const p=inversiones.find(i=>i.id===x.padreId); return p? hijosDe(p) : []; }
  if(x.esGrupo || x.estado==="activa") return inversiones.filter(i=>!i.padreId && (i.esGrupo||i.estado==="activa")).sort(porOrden);
  return inversiones.filter(i=>!i.padreId && !i.esGrupo && i.estado!=="activa").sort(porOrden);
}
function flechasHtml(x){
  if(!modoOrdenInv) return "";
  return `<div style="display:flex;gap:6px;justify-content:flex-end;padding:0 4px 6px"><button class="btn ghost" data-mover="${x.id}|up">▲ Subir</button><button class="btn ghost" data-mover="${x.id}|down">▼ Bajar</button></div>`;
}
function sliceInversiones(){
  const items = [];
  inversiones.filter(i=>!i.padreId && i.esGrupo).forEach(g=>{
    const v = valorGrupo(g);
    if(v>0) items.push({nombre:g.nombre, total:v, hijos:hijosDe(g).filter(h=>h.estado==="activa" && h.valorActual>0).map(h=>({nombre:h.nombre, total:h.valorActual}))});
  });
  inversiones.filter(i=>!i.padreId && !i.esGrupo && i.estado==="activa" && i.valorActual>0).forEach(i=>items.push({nombre:i.nombre, total:i.valorActual, hijos:[]}));
  const totalGlobal = items.reduce((s,x)=>s+x.total,0);
  return items.sort((a,b)=>b.total-a.total).map((x,k)=>({...x, color:PALETTE[k%PALETTE.length], pct: totalGlobal? x.total/totalGlobal*100 : 0, totalGlobal}));
}
function grupoItem(g){
  const abierto = !!gruposAbiertos[g.id];
  const hs = hijosDe(g);
  const val = valorGrupo(g);
  const ben = beneficioGrupo(g);
  const rG = rentasGrupo(g);
  const cab = `
  <div class="item" data-toggle-grupo="${g.id}" style="cursor:pointer;background:var(--accent-soft);border-color:transparent">
    <div>
      <strong>${abierto?"▾":"▸"} ${esc(g.nombre)}</strong>
      <span class="tag" style="background:var(--card)">${hs.length} inversion${hs.length===1?"":"es"}</span>
      <div class="meta">Beneficio: <span class="${ben>=0?'pos':'neg'}">${eur(ben)}</span>${rG>0?` · Rentas: <span class="pos">${eur(rG)}</span>`:""}</div>
    </div>
    <div class="amt">${eur(val)}</div>
  </div>${flechasHtml(g)}`;
  if(!abierto) return cab;
  return cab + `
  <div style="margin:2px 0 6px 12px;padding-left:10px;border-left:2px solid var(--accent-soft);display:flex;flex-direction:column;gap:8px">
    ${hs.length? hs.map(invItem).join("") : `<div class="empty" style="padding:14px">Grupo vacío. Asigna inversiones desde "Editar información".</div>`}
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${editarInfoInvId!==g.id?`<button class="btn ghost" data-editar-info="${g.id}">Renombrar grupo</button>`:""}
      <button class="btn ghost" data-del-inv="${g.id}">Borrar grupo</button>
    </div>
    ${editarInfoInvId===g.id? `<div class="item" style="flex-direction:column;align-items:stretch;gap:8px"><label>Nombre</label><input id="infoNombre" value="${esc(g.nombre)}"><div style="display:flex;gap:8px"><button class="btn" data-confirmar-info="${g.id}">Guardar</button><button class="btn ghost" data-cancelar-info="1">Cancelar</button></div></div>` : ""}
  </div>`;
}

function invItem(inv){
  if(inv.esGrupo) return grupoItem(inv);
  const esActiva = inv.estado === "activa";
  const aportado = aportadoInv(inv);
  const beneficio = beneficioInv(inv);
  const expandida = expandidaInvId === inv.id;

  const cabecera = `
  <div class="item" data-expandir-inv="${inv.id}" style="cursor:pointer">
    <div>
      <strong>${esc(inv.nombre)}</strong>
      ${inv.tipo?`<span class="tag">${esc(inv.tipo)}</span>`:""}
      ${!esActiva?`<span class="tag">Planificada</span>`:""}
    </div>
    <div class="amt">${esActiva? eur(inv.valorActual) : "—"}</div>
  </div>${flechasHtml(inv)}`;

  if(!expandida) return cabecera;

  return cabecera + `
  <div style="padding:0 4px 6px">
    ${esActiva? `<div class="meta">Aportado: ${eur(aportado)}</div>` : `<div class="meta">Sin aportar todavía — no cuenta en tu patrimonio</div>`}
    ${!esActiva && (inv.fechaPrevista||inv.importePrevisto)? `<div class="meta">Previsto: ${inv.importePrevisto?eur(inv.importePrevisto):"—"}${inv.fechaPrevista?` el ${inv.fechaPrevista}`:""}${inv.cuentaPrevistaId?` desde ${cuentaNombre(inv.cuentaPrevistaId)}`:""}</div>` : ""}
    ${esActiva? `<div class="meta">Beneficio: <span class="${beneficio>=0?'pos':'neg'}">${eur(beneficio)}</span></div>` : ""}
    ${esActiva? `<div class="meta">Rentas: <span class="pos">${eur(inv.rentas||0)}</span> · solo recuento, no afecta al valor</div>` : ""}
  </div>
  <div style="display:flex;gap:8px;padding:0 4px 8px;flex-wrap:wrap">
    ${aportarInvId!==inv.id?`<button class="btn gold" data-aportar-inv="${inv.id}">Aportar</button>`:""}
    ${esActiva && inv.valorActual>0 && rescatarInvId!==inv.id?`<button class="btn ghost" data-rescatar-inv="${inv.id}">Rescatar</button>`:""}
    ${esActiva && editarValorInvId!==inv.id?`<button class="btn ghost" data-editar-valor="${inv.id}">Actualizar valor</button>`:""}
    ${esActiva && rentasInvId!==inv.id?`<button class="btn ghost" data-rentas-inv="${inv.id}">Anotar rentas</button>`:""}
    ${aportado>0 || esActiva ? `<button class="btn ghost" data-ver-aportaciones="${inv.id}">${verAportacionesId===inv.id?"Ocultar aportaciones":"Ver aportaciones"}</button>` : ""}
    ${editarInfoInvId!==inv.id?`<button class="btn ghost" data-editar-info="${inv.id}">Editar información</button>`:""}
    <button class="btn ghost" data-del-inv="${inv.id}">Borrar</button>
  </div>
  ${verAportacionesId===inv.id? renderListaAportaciones(inv) : ""}
  ${aportarInvId===inv.id? `
  <div class="item" style="flex-direction:column;align-items:stretch;gap:8px">
    <label>Importe a aportar (€)</label>
    <input type="number" step="0.01" min="0" id="aportarImporte" value="${inv.importePrevisto||''}">
    <label>Cuenta de origen</label>
    ${cuentas.length? `<select id="aportarCuenta">${opcionesCuentas(inv.cuentaPrevistaId)}</select>` : `<div class="meta">Crea antes una cuenta en la pestaña "Cuentas".</div>`}
    <div style="display:flex;gap:8px">
      <button class="btn" data-confirmar-aportar="${inv.id}" ${cuentas.length?"":"disabled"}>Confirmar</button>
      <button class="btn ghost" data-cancelar-aportar="1">Cancelar</button>
    </div>
  </div>` : ""}
  ${rescatarInvId===inv.id? `
  <div class="item" style="flex-direction:column;align-items:stretch;gap:8px">
    <label>Importe a rescatar (€) — máximo ${eur(inv.valorActual)}</label>
    <input type="number" step="0.01" min="0" max="${inv.valorActual}" id="rescatarImporte">
    <label>Cuenta destino</label>
    ${cuentas.length? `<select id="rescatarCuenta">${opcionesCuentas()}</select>` : `<div class="meta">Crea antes una cuenta en la pestaña "Cuentas".</div>`}
    <div style="display:flex;gap:8px">
      <button class="btn" data-confirmar-rescate="${inv.id}" ${cuentas.length?"":"disabled"}>Confirmar</button>
      <button class="btn ghost" data-cancelar-rescate="1">Cancelar</button>
    </div>
  </div>` : ""}
  ${rentasInvId===inv.id? `
  <div class="item" style="flex-direction:column;align-items:stretch;gap:8px">
    <label>Cantidad (€)</label>
    <input type="number" step="0.01" id="rentasImporte">
    <p class="meta" style="margin:0">Llevas ${eur(inv.rentas||0)} en rentas. Es solo un recuento: no cambia el valor de la inversión, ni el patrimonio, ni crea movimientos. Para corregir un error, suma una cantidad negativa o fija el total.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" data-sumar-rentas="${inv.id}">Sumar</button>
      <button class="btn gold" data-fijar-rentas="${inv.id}">Fijar total</button>
      <button class="btn ghost" data-cancelar-rentas="1">Cancelar</button>
    </div>
  </div>` : ""}
  ${editarValorInvId===inv.id? `
  <div class="item" style="flex-direction:column;align-items:stretch;gap:8px">
    <label>Nuevo valor actual (€)</label>
    <input type="number" step="0.01" id="valorNuevo" value="${inv.valorActual}">
    <div style="display:flex;gap:8px">
      <button class="btn" data-confirmar-valor="${inv.id}">Guardar</button>
      <button class="btn ghost" data-cancelar-valor="1">Cancelar</button>
    </div>
  </div>` : ""}
  ${editarInfoInvId===inv.id? `
  <div class="item" style="flex-direction:column;align-items:stretch;gap:8px">
    <label>Nombre</label><input id="infoNombre" value="${esc(inv.nombre)}">
    <label>Tipo</label><input id="infoTipo" value="${esc(inv.tipo||'')}">
    ${grupos().length? `<label>Grupo</label><select id="infoGrupo"><option value="">Sin grupo</option>${opcionesGrupos(inv.padreId)}</select>` : ""}
    ${!esActiva? `
    <label>Fecha prevista</label><input id="infoFechaPrevista" type="date" value="${inv.fechaPrevista||''}">
    <label>Importe previsto (€)</label><input id="infoImportePrevisto" type="number" step="0.01" min="0" value="${inv.importePrevisto??''}">
    <label>Cuenta prevista</label>
    ${cuentas.length? `<select id="infoCuentaPrevista"><option value="">Sin elegir todavía</option>${cuentas.map(c=>`<option value="${c.id}" ${c.id===inv.cuentaPrevistaId?"selected":""}>${esc(c.nombre)}</option>`).join("")}</select>` : `<div class="meta">Crea una cuenta cuando quieras usarla.</div>`}
    ` : ""}
    <div style="display:flex;gap:8px">
      <button class="btn" data-confirmar-info="${inv.id}">Guardar</button>
      <button class="btn ghost" data-cancelar-info="1">Cancelar</button>
    </div>
  </div>` : ""}`;
}

function renderInversiones(){
  const topActivos = inversiones.filter(i=>!i.padreId && (i.esGrupo || i.estado==="activa")).sort(porOrden);
  const topPlan = inversiones.filter(i=>!i.padreId && !i.esGrupo && i.estado!=="activa").sort(porOrden);
  const reales = inversiones.filter(i=>!i.esGrupo && i.estado==="activa");
  const totalValor = reales.reduce((s,i)=>s+i.valorActual,0);
  const totalBeneficio = reales.reduce((s,i)=>s+beneficioInv(i),0);
  const totalRentas = reales.reduce((s,i)=>s+(i.rentas||0),0);
  const slices = sliceInversiones();
  const bloqueGrafica = slices.length ? `
  <div class="card">
    <h2>Distribución de tus inversiones</h2>
    <div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:10px">
      <div style="width:130px;height:130px;border-radius:50%;background:conic-gradient(${pieStyle(slices)});flex-shrink:0;position:relative">
        <div style="position:absolute;inset:30px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px">${eur(totalValor)}</div>
      </div>
      <div style="flex:1;min-width:190px;display:flex;flex-direction:column;gap:8px">
        ${slices.map(sl=>`
        <div>
          <div style="display:flex;align-items:center;gap:8px;font-size:13px">
            <span style="width:12px;height:12px;border-radius:50%;background:${sl.color};flex-shrink:0"></span>
            <span style="flex:1;font-weight:600">${esc(sl.nombre)}</span>
            <span class="meta">${eur(sl.total)} · ${sl.pct.toFixed(1)}%</span>
          </div>
          ${sl.hijos.map(h=>`<div class="meta" style="margin-left:20px;display:flex;justify-content:space-between"><span>${esc(h.nombre)}</span><span>${(sl.totalGlobal? h.total/sl.totalGlobal*100 : 0).toFixed(1)}%</span></div>`).join("")}
        </div>`).join("")}
      </div>
    </div>
  </div>` : "";
  return `
  ${bloqueGrafica}
  <div class="card">
    <h2>Nueva inversión</h2>
    <form id="fInversion">
      <div class="row2">
        <div><label>Nombre</label><input name="nombre" placeholder="ej. Trade Republic" required></div>
        <div><label>Tipo (opcional)</label><input name="tipo" placeholder="ej. ETF, inmobiliaria..."></div>
      </div>
      ${grupos().length? `<div><label>Grupo (opcional)</label><select name="grupoId"><option value="">Sin grupo</option>${opcionesGrupos()}</select></div>` : ""}
      <div><label>Estado</label><select name="estado" id="invEstado"><option value="activa">Activa — ya tengo dinero invertido</option><option value="planificada">Planificada — todavía no he aportado nada</option></select></div>
      <div id="invValorWrap"><label>Valor actual inicial (€)</label><input name="valorActual" type="number" step="0.01" value="0" id="invValorInput" required></div>
      <div id="invPlanWrap" style="display:none">
        <div class="row2">
          <div><label>Fecha prevista</label><input name="fechaPrevista" type="date"></div>
          <div><label>Importe previsto (€)</label><input name="importePrevisto" type="number" step="0.01" min="0"></div>
        </div>
        <label>Cuenta prevista</label>
        ${cuentas.length? `<select name="cuentaPrevista"><option value="">Sin elegir todavía</option>${opcionesCuentas(null, true)}</select>` : `<div class="meta">Crea una cuenta cuando quieras usarla.</div>`}
      </div>
      <button class="btn" type="submit">Añadir</button>
    </form>
  </div>
  <div class="card">
    <h2>Nuevo grupo</h2>
    <p class="meta" style="margin:0 0 10px">Agrupa varias inversiones bajo un mismo nombre (por ejemplo, "Trade Republic Felicidad"). Después eliges el grupo desde "Editar información" de cada inversión.</p>
    <form id="fGrupo">
      <div><label>Nombre del grupo</label><input name="nombre" required></div>
      <button class="btn" type="submit">Crear grupo</button>
    </form>
  </div>
  <div class="section-title" style="display:flex;justify-content:space-between;align-items:center">
    <span>Activas · Valor ${eur(totalValor)} · Beneficio ${eur(totalBeneficio)}${totalRentas>0?` · Rentas ${eur(totalRentas)}`:""}</span>
    <button class="btn ghost" data-toggle-orden="1" style="color:var(--accent)">${modoOrdenInv?"Listo":"Ordenar"}</button>
  </div>
  <div class="list">
    ${topActivos.length? topActivos.map(invItem).join("") : `<div class="empty">Sin inversiones activas todavía.</div>`}
  </div>
  <div class="section-title">Planificadas · no cuentan en tu patrimonio</div>
  <div class="list">
    ${topPlan.length? topPlan.map(invItem).join("") : `<div class="empty">Sin inversiones planificadas.</div>`}
  </div>`;
}

      <input id="catNuevoNombre" value="${esc(c.nombre)}">
      <div style="display:flex;gap:8px">
        <button class="btn" data-confirmar-cat="${c.id}">Guardar</button>
        <button class="btn ghost" data-cancelar-cat="1">Cancelar</button>
      </div>

    <div class="item">
      <div>${esc(c.nombre)}</div>
      <div style="display:flex;gap:8px">
        <button class="btn ghost" data-editar-cat="${c.id}">Renombrar</button>
        <button class="btn ghost" data-del-cat="${c.id}">Borrar</button>
      </div>
    </div>`;
}

function renderCategorias(){
  const porPadre = {};
  categorias.filter(c=>c.tipo==="gasto").forEach(c=>{ const p=c.padre||"Otros"; (porPadre[p]=porPadre[p]||[]).push(c); });
  const ingresoList = categorias.filter(c=>c.tipo==="ingreso");
  const padres = Object.keys(porPadre);
  const claves = [...padres, ...(ingresoList.length ? ["__ingresos__"] : [])];
  const todasContraidas = claves.length>0 && claves.every(k=>catsContraidas[k]);
  return `
  <div class="card">
    <h2>Nueva categoría</h2>
    <form id="fCategoria">
      <div class="row2">
        <div><label>Tipo</label><select name="tipo" id="catTipo"><option value="gasto">Gasto</option><option value="ingreso">Ingreso</option></select></div>
        <div id="catPadreWrap"><label>Grupo</label><input name="padre" id="catPadre" list="padresList" placeholder="ej. Imprescindible"><datalist id="padresList">${padres.map(p=>`<option value="${esc(p)}">`).join("")}</datalist></div>
      </div>
      <div><label>Nombre</label><input name="nombre" placeholder="ej. Gasolina" required></div>
      <button class="btn" type="submit">Añadir</button>
    </form>
  </div>
  <div class="section-title" style="display:flex;justify-content:space-between;align-items:center">
    <span>Gastos</span>
    ${padres.length + (ingresoList.length?1:0) > 1? `<button class="btn ghost" data-toggle-todas-cats="${todasContraidas?'expandir':'contraer'}" style="color:var(--accent)">${todasContraidas?"Expandir todas":"Contraer todas"}</button>` : ""}
  </div>
  <div class="list">
    ${padres.length? padres.map(p=>{
      const cerrado = !!catsContraidas[p];
      return `
      <div data-toggle-cat="${esc(p)}" style="cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:8px 4px;margin-top:4px;font-weight:700;font-size:14px">
        <span>${cerrado?"▸":"▾"} ${esc(p)}</span>
        <span class="meta" style="font-weight:400">${porPadre[p].length} categoría${porPadre[p].length===1?"":"s"}</span>
      </div>
      ${cerrado? "" : porPadre[p].map(catItem).join("")}`;
    }).join("") : `<div class="empty">Sin categorías de gasto todavía.</div>`}
  </div>
  <div class="section-title">Ingresos</div>
  <div class="list">
    ${ingresoList.length? `
      <div data-toggle-cat="__ingresos__" style="cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:8px 4px;font-weight:700;font-size:14px">
        <span>${catsContraidas["__ingresos__"]?"▸":"▾"} Ingresos</span>
        <span class="meta" style="font-weight:400">${ingresoList.length} categoría${ingresoList.length===1?"":"s"}</span>
      </div>
      ${catsContraidas["__ingresos__"]? "" : ingresoList.map(catItem).join("")}` : `<div class="empty">Sin categorías de ingreso todavía.</div>`}
  </div>`;
}

function render(){
  renderTabs();
  renderBalance();
  renderPeriodo();
  const app = document.getElementById("app");
  if(!ready){ app.innerHTML = `<div class="status">Cargando...</div>`; return; }
  if(tab==="Gastos") app.innerHTML = renderGastos();
  else if(tab==="Resumen del mes") app.innerHTML = renderResumen();
  else if(tab==="Presupuestos") app.innerHTML = renderPresupuestos();
  else if(tab==="Movimientos") app.innerHTML = renderMovimientos();
  else if(tab==="Deudas") app.innerHTML = renderDeudas();
  else if(tab==="Cuentas") app.innerHTML = renderCuentas();
  else if(tab==="Importar") app.innerHTML = renderImportar();
  else if(tab==="Inversiones") app.innerHTML = renderInversiones();
  else if(tab==="Objetivos") app.innerHTML = renderObjetivos();
  else if(tab==="Preferencias") app.innerHTML = renderPreferencias();
  else app.innerHTML = renderCategorias();
  wireEvents();
  if(pendienteEnfoque){
    const el = document.getElementById(pendienteEnfoque);
    pendienteEnfoque = null;
    if(el){ el.scrollIntoView({block:"center", behavior:"smooth"}); try{ el.focus({preventScroll:true}); }catch(e){} }
  }
}

function wireEvents(){
  const cat = document.getElementById("movCat");
  const tipoSel = document.getElementById("movTipo");
  if(cat){
    const fill = ()=>{
      if(tipoSel.value==="gasto"){
        const porPadre = {};
        categorias.filter(c=>c.tipo==="gasto").forEach(c=>{ const p=c.padre||"Otros"; (porPadre[p]=porPadre[p]||[]).push(c); });
        cat.innerHTML = Object.keys(porPadre).length
          ? Object.entries(porPadre).map(([p,cats])=>`<optgroup label="${esc(p)}">${cats.map(c=>`<option value="${esc(c.nombre)}">${esc(c.nombre)}</option>`).join("")}</optgroup>`).join("")
          : `<option value="">Crea una categoría en la pestaña "Categorías"</option>`;
      } else {
        const list = categorias.filter(c=>c.tipo==="ingreso");
        cat.innerHTML = list.length ? list.map(c=>`<option value="${esc(c.nombre)}">${esc(c.nombre)}</option>`).join("") : `<option value="">Crea una categoría en la pestaña "Categorías"</option>`;
      }
    };
    fill(); tipoSel.onchange = fill;
  }
  const fMov = document.getElementById("fMov");
  if(fMov) fMov.onsubmit = (e)=>{
    e.preventDefault();
    conCarga(fMov.querySelector('button[type="submit"]'), "Guardando…", async ()=>{
      const f = new FormData(fMov);
      const data = {tipo:f.get("tipo"), categoria:f.get("categoria"), importe:parseFloat(f.get("importe")), fecha:f.get("fecha"), nota:f.get("nota")||"", cuenta_id:f.get("cuentaId")||null};
      const {error} = await sb.from("movimientos").insert(data);
      if(error){ showError("No se pudo guardar el movimiento: "+error.message); return; }
      hideError(); fMov.reset(); await fetchAll();
    });
  };
  const fDeuda = document.getElementById("fDeuda");
  const fDeudaDir = fDeuda ? fDeuda.querySelector('select[name="direccion"]') : null;
  const deudaMovWrap = document.getElementById("deudaMovWrap");

  document.querySelectorAll("[data-editar-presupuesto]").forEach(b=>b.onclick=()=>{ editarPresupuestoId=b.dataset.editarPresupuesto; render(); });
  document.querySelectorAll("[data-cancelar-presupuesto]").forEach(b=>b.onclick=()=>{ editarPresupuestoId=null; render(); });
  document.querySelectorAll("[data-confirmar-presupuesto]").forEach(b=>b.onclick=()=>conCarga(b, "Guardando…", async ()=>{
    const id = b.dataset.confirmarPresupuesto;
    const nuevo = parseFloat(document.getElementById("presupuestoNuevoLimite")?.value);
    if(isNaN(nuevo)) return;
    const {error} = await sb.from("presupuestos").update({limite:nuevo}).eq("id", id);
    if(error){ showError("No se pudo guardar: "+error.message); return; }
    hideError(); editarPresupuestoId=null; await fetchAll();
  }));

  const objTipoVinculo = document.getElementById("objTipoVinculo");
  const objVinculoWrap = document.getElementById("objVinculoWrap");
  const objVinculoSelect = document.getElementById("objVinculoSelect");
  if(objTipoVinculo && objVinculoWrap){
    const toggleObj = ()=>{
      const v = objTipoVinculo.value;
      objVinculoWrap.style.display = v==="ninguno" ? "none" : "block";
      if(objVinculoSelect){
        if(v==="cuenta") objVinculoSelect.innerHTML = opcionesCuentas();
        else if(v==="inversion") objVinculoSelect.innerHTML = inversiones.map(i=>`<option value="${i.id}">${esc(i.nombre)}${i.esGrupo?" (grupo)":""}</option>`).join("");
      }
    };
    toggleObj(); objTipoVinculo.onchange = toggleObj;
  }
  const fObjetivo = document.getElementById("fObjetivo");
  if(fObjetivo) fObjetivo.onsubmit = (e)=>{
    e.preventDefault();
    conCarga(fObjetivo.querySelector('button[type="submit"]'), "Guardando…", async ()=>{
      const f = new FormData(fObjetivo);
      const tipoVinculo = f.get("tipoVinculo")||"ninguno";
      const data = {nombre:f.get("nombre"), meta:parseFloat(f.get("meta")), tipo_vinculo:tipoVinculo, vinculo_id: tipoVinculo==="ninguno"?null:(f.get("vinculoId")||null), orden:siguienteOrdenLista(objetivos)};
      const {error} = await sb.from("objetivos").insert(data);
      if(error){ showError("No se pudo guardar el objetivo: "+error.message); return; }
      hideError(); fObjetivo.reset(); await fetchAll();
    });
  };
  document.querySelectorAll("[data-del-objetivo]").forEach(b=>b.onclick=()=>{
    if(!confirm("¿Borrar este objetivo?")) return;
    conCarga(b, "Borrando…", async ()=>{
      const {error} = await sb.from("objetivos").delete().eq("id", b.dataset.delObjetivo);
      if(error){ showError("No se pudo borrar: "+error.message); return; }
      hideError(); await fetchAll();
    });
  });

  const guessAny = (res)=>{
    const norm = h=>h.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
    for(const re of res){ const h = csvHeaders.find(x=>re.test(norm(x))); if(h) return h; }
    return "";
  };
  const csvFile = document.getElementById("csvFile");
  if(csvFile) csvFile.onchange = ()=>{
    const file = csvFile.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      let txt;
      try{ txt = new TextDecoder("utf-8", {fatal:true}).decode(reader.result); }
      catch(e){ txt = new TextDecoder("windows-1252").decode(reader.result); }
      txt = txt.replace(/^\uFEFF/, "");
      const {headers, filas} = parseCSV(txt);
      csvHeaders = headers; csvFilas = filas; csvPreview = [];
      csvSel = {
        fecha: guessAny([/fecha operacion/,/fecha/,/date/]) || headers[0] || "",
        importe: guessAny([/importe/,/amount/,/cantidad/]) || headers[1] || headers[0] || "",
        nota: guessAny([/concepto/,/descripcion/,/detalle/,/movimiento/,/description/]),
        saldo: guessAny([/saldo/,/balance/]),
        cuenta: cuentaPorDefecto() || (cuentas[0] ? cuentas[0].id : "")
      };
      render();
    };
    reader.readAsArrayBuffer(file);
  };
  [["csvColFecha","fecha"],["csvColImporte","importe"],["csvColNota","nota"],["csvColSaldo","saldo"]].forEach(([id,k])=>{
    const el = document.getElementById(id);
    if(el) el.onchange = ()=>{ csvSel[k] = el.value; if(csvPreview.length){ csvPreview = []; render(); } };
  });
  const csvCuentaEl = document.getElementById("csvCuenta");
  if(csvCuentaEl) csvCuentaEl.onchange = ()=>{ csvSel.cuenta = csvCuentaEl.value; if(csvPreview.length){ calcularPreview(); render(); } };
  const csvPrevisualizar = document.getElementById("csvPrevisualizar");
  if(csvPrevisualizar) csvPrevisualizar.onclick = ()=>{ calcularPreview(); render(); };
  const csvImportar = document.getElementById("csvImportar");
  if(csvImportar) csvImportar.onclick = ()=>conCarga(csvImportar, "Importando…", async ()=>{
    const filas = csvPreview.filter(m=>!m.dup && !m.invalida).map(m=>({
      cuenta_id: csvSel.cuenta, tipo:m.tipo, importe:m.importe, fecha:m.fecha, descripcion:m.nota||"", saldo:m.saldo, posicion:m.posicion
    }));
    if(!filas.length || !csvSel.cuenta) return;
    const {error} = await sb.from("movimientos_pendientes").insert(filas);
    if(error){ showError("No se pudo importar: "+error.message); return; }
    hideError(); csvHeaders=[]; csvFilas=[]; csvPreview=[]; csvSel={}; await fetchAll();
  });

  document.querySelectorAll('select[id^="pendCat-"]').forEach(el=>el.onchange = ()=>{ pendCats[el.id.slice(8)] = el.value; });
  document.querySelectorAll("[data-pend-confirmar]").forEach(b=>b.onclick=()=>conCarga(b, "…", async ()=>{
    const id = b.dataset.pendConfirmar;
    const cat = document.getElementById("pendCat-"+id)?.value;
    if(!cat){ showError("Elige una categoría antes de confirmar."); return; }
    const {error} = await sb.rpc("confirmar_pendiente", {p_id:id, p_categoria:cat});
    if(error){ showError("No se pudo confirmar: "+error.message); return; }
    delete pendCats[id]; hideError(); await fetchAll();
  }));
  document.querySelectorAll("[data-pend-descartar]").forEach(b=>b.onclick=()=>{
    if(!confirm("¿Descartar este movimiento? No se importará.")) return;
    conCarga(b, "…", async ()=>{
      const id = b.dataset.pendDescartar;
      const {error} = await sb.from("movimientos_pendientes").delete().eq("id", id);
      if(error){ showError("No se pudo descartar: "+error.message); return; }
      delete pendCats[id]; hideError(); await fetchAll();
    });
  });
  const pendConfirmarTodos = document.getElementById("pendConfirmarTodos");
  if(pendConfirmarTodos) pendConfirmarTodos.onclick = ()=>conCarga(pendConfirmarTodos, "Confirmando…", async ()=>{
    const ids = [], cats = [];
    pendientes.forEach(p=>{ const c = document.getElementById("pendCat-"+p.id)?.value; if(c){ ids.push(p.id); cats.push(c); } });
    if(!ids.length){ showError("Elige la categoría de al menos un movimiento."); return; }
    const {error} = await sb.rpc("confirmar_pendientes", {p_ids:ids, p_categorias:cats});
    if(error){ showError("No se pudieron confirmar: "+error.message); return; }
    ids.forEach(id=>delete pendCats[id]); hideError(); await fetchAll();
  });
  const pendDescartarTodos = document.getElementById("pendDescartarTodos");
  if(pendDescartarTodos) pendDescartarTodos.onclick = ()=>{
    if(!confirm(`¿Descartar los ${pendientes.length} movimientos pendientes? No se importarán.`)) return;
    conCarga(pendDescartarTodos, "Descartando…", async ()=>{
      const {error} = await sb.from("movimientos_pendientes").delete().not("id","is",null);
      if(error){ showError("No se pudo descartar: "+error.message); return; }
      pendCats = {}; hideError(); await fetchAll();
    });
  };
}

async function fetchAll(){
  try{
    const [{data:cta, error:e1}, {data:mov, error:e2}, {data:deu, error:e3}, {data:inv, error:e4}, {data:apo, error:e5}, {data:cat, error:e6}, {data:ret, error:e7}, {data:pre, error:e8}, {data:obj, error:e9}, {data:pen, error:e10}, {data:pref}] = await Promise.all([
      sb.from("cuentas").select("*").order("nombre"),
      sb.from("movimientos").select("*").order("fecha", {ascending:false}),
      sb.from("deudas").select("*"),
      sb.from("inversiones").select("*"),
      sb.from("aportaciones_inversion").select("*"),
      sb.from("categorias").select("*"),
      sb.from("retiros_inversion").select("*"),
      sb.from("presupuestos").select("*"),
      sb.from("objetivos").select("*"),
      sb.from("movimientos_pendientes").select("*"),
      sb.from("preferencias").select("*")
    ]);
    const err = e1||e2||e3||e4||e5||e6||e7||e8||e9||e10;
    if(err){ ready = true; render(); showError("No se pudieron cargar los datos: "+err.message); return; }
    cuentas = (cta||[]).map(c=>({id:c.id, nombre:c.nombre, saldoInicial:Number(c.saldo_inicial), orden:c.orden||0})).sort(porOrden);
    movimientos = (mov||[]).map(m=>({id:m.id, tipo:m.tipo, categoria:m.categoria, importe:Number(m.importe), fecha:m.fecha, nota:m.nota, cuentaId:m.cuenta_id, saldoBanco:m.saldo_banco!=null?Number(m.saldo_banco):null, presupuesto:m.presupuesto||null, presupuestoFecha:m.presupuesto_fecha||null, reembolsoDe:m.reembolso_de||null}));
    deudas = (deu||[]).map(d=>({id:d.id, persona:d.persona, importe:Number(d.importe), direccion:d.direccion, concepto:d.concepto, estado:d.estado, fecha:d.fecha, presupuesto:d.presupuesto||null, movimientoId:d.movimiento_id||null}));
    inversiones = (inv||[]).map(i=>({id:i.id, nombre:i.nombre, tipo:i.tipo, valorActual:Number(i.valor_actual), valorInicial:Number(i.valor_inicial), estado:i.estado||"activa", fechaPrevista:i.fecha_prevista, importePrevisto:i.importe_previsto!=null?Number(i.importe_previsto):null, cuentaPrevistaId:i.cuenta_prevista_id, padreId:i.padre_id||null, esGrupo:!!i.es_grupo, orden:i.orden||0, rentas:Number(i.rentas||0)}));
    aportaciones = (apo||[]).map(a=>({id:a.id, inversionId:a.inversion_id, importe:Number(a.importe), fecha:a.fecha, cuentaId:a.cuenta_id, movimientoId:a.movimiento_id}));
    retiros = (ret||[]).map(r=>({id:r.id, inversionId:r.inversion_id, importe:Number(r.importe), fecha:r.fecha, cuentaId:r.cuenta_id, movimientoId:r.movimiento_id}));
    presupuestos = (pre||[]).map(p=>({id:p.id, categoria:p.categoria, limite:Number(p.limite)}));
    objetivos = (obj||[]).map(o=>({id:o.id, nombre:o.nombre, meta:Number(o.meta), tipoVinculo:o.tipo_vinculo, vinculoId:o.vinculo_id, orden:o.orden||0})).sort(porOrden);
    if(pref && pref[0]){
      cuentaDefecto = pref[0].cuenta_defecto || "";
      try{ if(cuentaDefecto) localStorage.setItem("cuentaDefecto", cuentaDefecto); else localStorage.removeItem("cuentaDefecto"); }catch(e){}
    }
    pendientes = (pen||[]).map(x=>({id:x.id, cuentaId:x.cuenta_id, tipo:x.tipo, importe:Number(x.importe), fecha:x.fecha, descripcion:x.descripcion||"", saldo:x.saldo!=null?Number(x.saldo):null, posicion:x.posicion||0}));
    if((cat||[]).length===0){
      const {error:eSeed} = await sb.from("categorias").insert(CATEGORIAS_DEFECTO);
      if(!eSeed){ const {data:cat2} = await sb.from("categorias").select("*"); categorias = (cat2||[]).map(c=>({id:c.id, tipo:c.tipo, padre:c.padre, nombre:c.nombre})); }
    } else {
      categorias = cat.map(c=>({id:c.id, tipo:c.tipo, padre:c.padre, nombre:c.nombre}));
    }
    hideError(); ready = true;
    const ae = document.activeElement;
    const escribiendo = refrescoSilencioso && ae && ["INPUT","SELECT","TEXTAREA"].includes(ae.tagName) && document.getElementById("app").contains(ae);
    refrescoSilencioso = false;
    if(escribiendo) renderBalance(); else render();
  }catch(e){
    ready = true; render();
    showError("No se han podido cargar los datos. Comprueba tu conexión e inténtalo de nuevo.");
  }
}

function applyAuthUI(){
  document.getElementById("authScreen").style.display = session ? "none" : "block";
  document.getElementById("appShell").style.display = session ? "block" : "none";
  if(session){
    const nombre = session.user.user_metadata?.full_name;
    document.getElementById("sesionInfo").textContent = nombre ? `Hola, ${nombre}` : session.user.email;
  }
}

let refrescoSilencioso = false;
function refrescar(){ if(!session) return; refrescoSilencioso = true; fetchAll(); }

async function startApp(){
  if(appStarted) return;
  appStarted = true;
  render();
  await fetchAll();
  let primeraSub = true;
  sb.channel("cambios")
    .on("postgres_changes", {event:"*", schema:"public", table:"movimientos"}, refrescar)
    .on("postgres_changes", {event:"*", schema:"public", table:"deudas"}, refrescar)
    .on("postgres_changes", {event:"*", schema:"public", table:"cuentas"}, refrescar)
    .on("postgres_changes", {event:"*", schema:"public", table:"inversiones"}, refrescar)
    .on("postgres_changes", {event:"*", schema:"public", table:"aportaciones_inversion"}, refrescar)
    .on("postgres_changes", {event:"*", schema:"public", table:"categorias"}, refrescar)
    .on("postgres_changes", {event:"*", schema:"public", table:"retiros_inversion"}, refrescar)
    .on("postgres_changes", {event:"*", schema:"public", table:"presupuestos"}, refrescar)
    .on("postgres_changes", {event:"*", schema:"public", table:"objetivos"}, refrescar)
    .on("postgres_changes", {event:"*", schema:"public", table:"movimientos_pendientes"}, refrescar)
    .subscribe((status)=>{
      if(status==="SUBSCRIBED"){ if(primeraSub) primeraSub = false; else refrescar(); }
    });
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") refrescar(); });
  window.addEventListener("online", refrescar);
}

async function init(){
  if(!SUPABASE_URL.startsWith("http")){
    document.body.innerHTML = `<div class="status">Falta configurar SUPABASE_URL y SUPABASE_ANON_KEY en el código.</div>`;
    return;
  }
  document.getElementById("fLogin").onsubmit = async (e)=>{
    e.preventDefault();
    const email = document.getElementById("loginEmail").value;
    const nombre = document.getElementById("loginNombre").value;
    const msg = document.getElementById("loginMsg");
    msg.textContent = "Enviando...";
    localStorage.setItem("pendingName", nombre);
    const {error} = await sb.auth.signInWithOtp({email, options:{emailRedirectTo: window.location.href, data:{full_name: nombre}}});
    msg.textContent = error ? "Error: "+error.message : "Enlace enviado. Revisa tu correo y pulsa el enlace desde este mismo dispositivo.";
  };
  document.getElementById("btnLogout").onclick = ()=> sb.auth.signOut();

  const {data:{session:s}} = await sb.auth.getSession();
  session = s;
  await syncPendingName();
  applyAuthUI();
  if(session) startApp();

  sb.auth.onAuthStateChange(async (_event, s2)=>{
    session = s2;
    await syncPendingName();
    applyAuthUI();
    if(session) startApp();
  });
}

async function syncPendingName(){
  const pending = localStorage.getItem("pendingName");
  if(pending && session){
    const {data, error} = await sb.auth.updateUser({data:{full_name: pending}});
    if(!error && data?.user) session = {...session, user: data.user};
    localStorage.removeItem("pendingName");
  }
}
init();
</script>

<head>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f07f76">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
<script>
// Personalización (tema, color, fondo, imagen): se aplica antes de pintar para que no parpadee.
const FONDOS = {crema:["#fdf7f2","#1c1718"], menta:["#eef8f3","#141f1b"], lavanda:["#f4f1fc","#1b1925"], rosa:["#fdf0f1","#221a1c"], cielo:["#eef5fc","#151b23"], blanco:["#ffffff","#141414"]};
function leerPersonalizacion(){
  let p = {}; try{ p = JSON.parse(localStorage.getItem("personalizacion")||"{}")||{}; }catch(e){}
  let img = null; try{ img = localStorage.getItem("fondoImagen"); }catch(e){}
  return {tema:p.tema||"auto", acento:p.acento||"", fondo:FONDOS[p.fondo] ? p.fondo : "crema", velo:p.velo==null ? 55 : p.velo, imagen:img};
}
function aplicarPersonalizacion(p){
  p = p || leerPersonalizacion();
  const r = document.documentElement, st = r.style;
  if(p.tema==="auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", p.tema);
  if(p.acento){
    st.setProperty("--accent", p.acento);
    st.setProperty("--accent-2", `color-mix(in srgb, ${p.acento} 82%, black)`);
    st.setProperty("--accent-soft", `color-mix(in srgb, ${p.acento} 20%, var(--card))`);
  } else ["--accent","--accent-2","--accent-soft"].forEach(v=>st.removeProperty(v));
  if(p.fondo!=="crema"){ st.setProperty("--paper-l", FONDOS[p.fondo][0]); st.setProperty("--paper-d", FONDOS[p.fondo][1]); }
  else { st.removeProperty("--paper-l"); st.removeProperty("--paper-d"); }
  if(p.imagen){ st.setProperty("--fondo-img", `url("${p.imagen}")`); st.setProperty("--velo", p.velo+"%"); r.classList.add("con-imagen"); }
  else { st.removeProperty("--fondo-img"); st.removeProperty("--velo"); r.classList.remove("con-imagen"); }
}
aplicarPersonalizacion();
</script>
<style>
:root{
  --ink:#4a3b3b; --paper:var(--paper-l,#fdf7f2); --line:#f0e4dc;
  --accent:#f07f76; --accent-2:#e66b62; --accent-soft:#fde6e3;
  --mint:#3fae92; --mint-soft:#e1f4ed; --lav-soft:#ece8fb; --peach-soft:#fdebd8;
  --pos:#2f9e7a; --neg:#e0556a; --salmon:#f0958a; --aviso:#c98a00; --muted:#9a8a86; --card:#ffffff; --on-accent:#fff;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#f5ecea; --paper:var(--paper-d,#1c1718); --line:#3a3132;
    --accent:#f59a92; --accent-2:#f8aea7; --accent-soft:#3d2826;
    --mint:#7fd6bb; --mint-soft:#1f3530; --lav-soft:#2b2740; --peach-soft:#3a2d20;
    --pos:#6fd3ad; --neg:#ff8a9a; --salmon:#f4a69c; --aviso:#f2c14e; --muted:#b3a4a1; --card:#262021; --on-accent:#2b1917;
  }
}
:root[data-theme="dark"]{
  --ink:#f5ecea; --paper:var(--paper-d,#1c1718); --line:#3a3132;
  --accent:#f59a92; --accent-2:#f8aea7; --accent-soft:#3d2826;
  --mint:#7fd6bb; --mint-soft:#1f3530; --lav-soft:#2b2740; --peach-soft:#3a2d20;
  --pos:#6fd3ad; --neg:#ff8a9a; --salmon:#f4a69c; --aviso:#f2c14e; --muted:#b3a4a1; --card:#262021; --on-accent:#2b1917;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  min-height:100%; -webkit-font-smoothing:antialiased;
}
html:not(.con-imagen) body{background:
  radial-gradient(900px 500px at 100% -10%, color-mix(in srgb, var(--peach-soft) 70%, transparent), transparent 70%),
  radial-gradient(700px 500px at -10% 40%, color-mix(in srgb, var(--mint-soft) 55%, transparent), transparent 70%),
  var(--paper); background-attachment:fixed}
header{padding:22px 16px 6px; max-width:640px; margin:0 auto}
.cab-fila{display:flex; justify-content:space-between; align-items:center; gap:12px}
header h1{margin:0; font-size:26px; font-weight:800; letter-spacing:-0.02em}
.icono-btn{width:42px; height:42px; border-radius:50%; border:none; background:var(--card); box-shadow:0 2px 10px rgba(74,59,59,.1); cursor:pointer; color:var(--ink); display:flex; align-items:center; justify-content:center; flex-shrink:0}
.icono-btn.girando svg{animation:girar .8s linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}
.periodo{display:flex; gap:8px; margin:14px 0}
.periodo select{width:auto; padding:8px 30px 8px 14px; font-size:13.5px; font-weight:700; border-radius:999px; border:none; background:var(--accent-soft); color:var(--accent); -webkit-appearance:none; appearance:none}
.pill-sel{position:relative; display:inline-flex}
.pill-sel::after{content:""; position:absolute; right:13px; top:50%; width:6px; height:6px; border:solid var(--accent); border-width:0 2.5px 2.5px 0; transform:translateY(-70%) rotate(45deg); pointer-events:none}
header .mini{margin-bottom:0}
.balance{display:flex; gap:24px; margin-top:18px; flex-wrap:wrap}
.balance div{min-width:98px}
.balance .num{font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-0.01em}
.balance .lbl{font-size:11.5px; color:var(--muted); margin-top:3px}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.menu-overlay{
  display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:20;
}
.menu-overlay.open{display:block}
.menu-panel{
  position:fixed; top:0; bottom:0; left:0; width:78%; max-width:300px; background:var(--card);
  z-index:21; padding:22px 16px; overflow-y:auto; transform:translateX(-100%); transition:transform .2s ease;
  padding-top:calc(22px + env(safe-area-inset-top,0px));
}
.menu-panel.open{transform:translateX(0)}
.menu-marca{display:inline-flex; align-items:center; gap:8px; font-size:16px; font-weight:800; margin:0 4px 10px; padding:6px 16px 6px 10px;
  border-radius:999px; background:var(--accent-soft); border:1.5px solid color-mix(in srgb, var(--accent) 25%, transparent); color:var(--accent)}
.menu-marca svg{width:26px; height:26px}
.menu-version{font-size:12px; font-weight:600; color:var(--muted); margin-left:2px}
.menu-group-title{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); opacity:.8; margin:18px 10px 4px}
.menu-item{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:none; border:none; padding:8px 10px;
  border-radius:12px; font-size:14.5px; font-weight:500; color:var(--ink); cursor:pointer; font-family:inherit;
}
.menu-item .mi{width:20px; text-align:center; font-size:15px; opacity:.85}
.menu-item:hover{background:color-mix(in srgb, var(--accent-soft) 55%, transparent)}
.marca-hub{margin-left:auto; font-size:10.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; padding:3px 10px; border-radius:999px;
  background:var(--peach-soft); color:#c9803a; border:1px solid color-mix(in srgb, #c9803a 25%, transparent)}
/* Selector en cápsula de las secciones con varias pantallas (Gastos y Presupuestos, Simuladores…) */
.selector-seccion{display:flex; gap:4px; padding:4px; margin:0 0 14px; background:var(--card); border:1px solid var(--line); border-radius:999px;
  overflow-x:auto; scrollbar-width:none; box-shadow:0 4px 14px rgba(0,0,0,.04)}
.selector-seccion::-webkit-scrollbar{display:none}
.selector-seccion button{flex:1 0 auto; border:none; background:none; font-family:inherit; font-size:13.5px; font-weight:600; color:var(--muted);
  padding:9px 14px; border-radius:999px; cursor:pointer; white-space:nowrap; transition:background .15s, color .15s}
.selector-seccion button.activa{background:var(--accent-soft); color:var(--accent); font-weight:700}
.selector-seccion.hub button.activa{background:var(--lav-soft); color:#7a6cc9}
.card.cuenta-tarjeta{background:linear-gradient(140deg, var(--fondo-cuenta) 0%, color-mix(in srgb, var(--fondo-cuenta) 35%, var(--card)) 100%); border-color:transparent; border-radius:28px}
.cuotas{display:flex; gap:10px; overflow-x:auto; scrollbar-width:none; margin:0 -16px 14px; padding:2px 16px 4px}
.cuotas::-webkit-scrollbar{display:none}
.cuota{flex:0 0 132px; background:var(--card); border:1px solid var(--line); border-radius:22px; padding:14px; display:flex; flex-direction:column; gap:3px}
.cuota strong{font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.cuota-ico{width:38px; height:38px; border-radius:50%; background:var(--lav-soft); display:flex; align-items:center; justify-content:center; font-size:18px; margin-bottom:6px}
.cuota-imp{font-weight:800; font-variant-numeric:tabular-nums}
.cuota-dias{align-self:flex-start; margin-top:6px; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; background:var(--mint-soft); color:var(--mint)}
.cuota.pronto .cuota-dias{background:var(--peach-soft); color:#c9803a}
.logros-fila{display:flex; justify-content:flex-end; margin:-4px 0 12px}
.logros-btn{border:1px solid var(--line); background:var(--card); color:var(--ink); font-family:inherit; font-size:13.5px; font-weight:600; padding:8px 14px; border-radius:999px; cursor:pointer}
.logros-btn b{margin-left:4px; color:var(--muted); font-weight:700}
.volver-seccion{border:none; background:var(--card); border:1px solid var(--line); color:var(--muted); font-family:inherit; font-size:13.5px; font-weight:600;
  padding:8px 14px; border-radius:999px; cursor:pointer; margin:0 0 14px}
.estrella-premium{margin-left:6px; font-size:.8em; vertical-align:.08em}
.premium-aviso{text-align:center; padding:28px 20px}
.premium-aviso .premium-icono{width:64px; height:64px; margin:0 auto 10px; border-radius:50%; background:var(--peach-soft); display:flex; align-items:center; justify-content:center; font-size:30px}
.premium-aviso p{margin:6px auto 0; max-width:320px; font-size:14.5px}
.miembro{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0; border-top:1px solid var(--line)}
.miembro span{min-width:0; overflow-wrap:anywhere}
.miembro:first-child{border-top:none; padding-top:0}
/* Comunidad */
.comunidad-hero{font-size:18px; font-weight:800; margin:0 4px 14px}
.comunidad-cab{display:flex; align-items:center; gap:10px}
.comunidad-cab h2{margin:0; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.comunidad-ico{width:40px; height:40px; flex-shrink:0; border-radius:50%; background:var(--accent-soft); display:flex; align-items:center; justify-content:center; font-size:19px}
.comunidad > .meta{margin:10px 0 14px}
.comunidad .gratis{font-size:11px; font-weight:800; padding:2px 8px; border-radius:999px; background:var(--mint-soft); color:var(--mint)}
.comunidad textarea{width:100%; resize:vertical; margin-bottom:12px}
.comunidad .opciones{margin-bottom:14px}
.comunidad-intro{background:var(--peach-soft); border-radius:16px; padding:12px 14px; margin-bottom:12px}
.comunidad-intro p{margin:6px 0 0; font-size:14px}
.nivel{display:flex; gap:12px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--line)}
.nivel > span{font-size:22px} .nivel p{margin:4px 0 0}
.nivel:last-of-type{border-bottom:none; margin-bottom:8px}
.comunidad-btns{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px}
.comunidad .chat{display:flex; flex-direction:column; gap:8px; max-height:340px; overflow-y:auto; margin-bottom:12px}
.burbuja{max-width:85%; padding:9px 13px; border-radius:16px; white-space:pre-wrap; font-size:14px}
.burbuja.de-admin{background:var(--accent-soft); align-self:flex-start; border-bottom-left-radius:4px}
.burbuja.mia{background:var(--paper); border:1px solid var(--line); align-self:flex-end; border-bottom-right-radius:4px}
.burbuja small{display:block; color:var(--muted); font-size:11px; margin-top:3px}
.mi-mensaje{padding:10px 0; border-bottom:1px solid var(--line)} .mi-mensaje:last-child{border-bottom:none}
.mi-mensaje p{margin:4px 0; white-space:pre-wrap}
.mi-mensaje .respuesta{background:var(--mint-soft); border-radius:12px; padding:10px 12px; font-size:14px; white-space:pre-wrap}
.comunidad-ok{background:var(--mint-soft); color:var(--ink); border-radius:16px; padding:14px; font-weight:600}
.comunidad-ok + .meta{margin:10px 0 0} .comunidad-ok ~ [data-comunidad-abrir="cambio"]{margin-top:10px} .aviso-aportacion{color:var(--aviso); font-weight:600}
.menu-item.active{background:var(--accent-soft); color:var(--accent); font-weight:700}
.menu-salir{margin-top:14px; color:var(--muted)}
main{padding:12px 16px calc(100px + env(safe-area-inset-bottom,0px)); max-width:640px; margin:0 auto}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:22px; padding:18px;
  margin-bottom:16px; box-shadow:0 2px 10px rgba(20,20,30,.04);
}
form{display:grid; gap:11px}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
label{font-size:12px; color:var(--muted); display:block; margin-bottom:4px; font-weight:600}
input,select,textarea{
  width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:14px;
  background:var(--paper); color:var(--ink); font-size:15px; font-family:inherit;
}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--mint); background:var(--card)}
.btn{
  background:var(--accent); color:var(--on-accent); border:none; padding:12px 20px; font-family:inherit;
  border-radius:999px; font-size:14px; font-weight:700; cursor:pointer; transition:background .15s ease;
}
.btn:hover{background:var(--accent-2)}
.btn.ghost{background:transparent; color:var(--muted); border:1.5px solid var(--line); padding:7px 14px; font-size:12.5px; border-radius:999px}
.btn.ghost:hover{background:var(--paper)}
.btn.gold{background:var(--accent-soft); color:var(--accent)}
.btn.gold:hover{filter:brightness(1.04)}
.list{display:flex; flex-direction:column; gap:8px}
.item{
  display:flex; justify-content:space-between; align-items:center; gap:10px;
  padding:14px; border:1px solid var(--line); border-radius:18px; background:var(--card);
}
.item .meta{font-size:12px; color:var(--muted); margin-top:2px}
.meta{font-size:12px; color:var(--muted)}
.lado{background:var(--card); border:1.5px solid var(--line); border-radius:18px; padding:14px; cursor:pointer; text-align:left; -webkit-tap-highlight-color:transparent}
.lado .cifra{font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; margin:3px 0 1px; letter-spacing:-0.01em}
.lado.activo.pos{border-color:var(--pos); box-shadow:0 0 0 3px rgba(22,163,74,.16)}
.lado.activo.neg{border-color:var(--neg); box-shadow:0 0 0 3px rgba(225,29,72,.14)}
.grip{display:inline-flex; flex-direction:column; justify-content:center; gap:3px; padding:10px 8px; margin:-10px 0 -10px -8px; cursor:grab; touch-action:none; flex-shrink:0; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
.grip i{display:block; width:16px; height:2px; border-radius:2px; background:var(--muted)}
.grip:active{cursor:grabbing}
.sort-item{display:flex; flex-direction:column; gap:8px}
.sort-arrastrando{opacity:.35}
.sort-ghost{position:fixed; z-index:70; pointer-events:none; margin:0; box-shadow:0 14px 34px rgba(0,0,0,.3); border-radius:18px; background:var(--card); opacity:.97}
.item .amt{font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; font-size:15px}
.tag{font-size:11px; padding:3px 10px; border-radius:999px; background:var(--accent-soft); border:none; color:var(--accent); font-weight:600}
.empty{color:var(--muted); font-size:13px; text-align:center; padding:32px 10px}
h2{font-size:16px; margin:0 0 12px; font-weight:800}
.section-title{font-size:17px; font-weight:800; color:var(--ink); margin:24px 0 10px}
.status{font-size:12px; color:var(--muted); text-align:center; padding:6px}
.errbar{
  display:none; position:fixed; left:12px; right:12px; bottom:calc(84px + env(safe-area-inset-bottom,0px)); z-index:40;
  background:var(--neg); color:#fff; padding:12px 14px; font-size:13px; line-height:1.35;
  align-items:center; justify-content:space-between; gap:10px; border-radius:16px; box-shadow:0 6px 24px rgba(0,0,0,.28);
}
.errbar.show{display:flex}
.errbar .errbtns{display:flex; gap:6px; flex-shrink:0}
.errbar button{background:rgba(255,255,255,.22); color:#fff; border:none; padding:6px 12px; border-radius:999px; font-size:12px; cursor:pointer; white-space:nowrap}
[hidden]{display:none!important}
/* Acceso */
.auth{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 20px; position:relative; overflow:hidden;
  --cielo-1:#7cc3f2; --cielo-2:#b9e0fb; --cielo-3:#fde7ee; --nube:#ffffff; --auth-suave:#6b5a58;
  background:radial-gradient(circle at 82% 12%, rgba(255,246,214,.9) 0 5%, rgba(255,240,200,.35) 12%, transparent 28%), linear-gradient(180deg, var(--cielo-1) 0%, var(--cielo-2) 48%, var(--cielo-3) 100%)}
:root[data-theme="dark"] .auth{--cielo-1:#1d2d57; --cielo-2:#4a5a92; --cielo-3:#a98bb0; --nube:#e9e4f5; --auth-suave:#ddd6ee}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .auth{--cielo-1:#1d2d57; --cielo-2:#4a5a92; --cielo-3:#a98bb0; --nube:#e9e4f5; --auth-suave:#ddd6ee} }
.auth-box{position:relative; z-index:1}
.nubes{position:absolute; inset:0; pointer-events:none; z-index:0}
.nube{position:absolute; left:0; filter:drop-shadow(0 6px 10px rgba(80,120,170,.12)); animation:nube linear infinite}
.nube use{fill:var(--nube)}
@keyframes nube{from{transform:translateX(-45vw)} to{transform:translateX(115vw)}}
@media (prefers-reduced-motion: reduce){.nube{animation:none; transform:translateX(var(--x,20vw))}}
.auth .auth-sub, .auth .auth-pie{color:var(--auth-suave)}
.auth-box{width:100%; max-width:380px}
.auth-logo{text-align:center; line-height:0}
.auth-logo svg{overflow:visible; filter:drop-shadow(0 8px 14px rgba(240,127,118,.25))}
.auth-logo .moneda{animation:moneda 2.4s ease-in infinite}
@keyframes moneda{0%{transform:translateY(-10px); opacity:0} 20%{opacity:1} 60%{transform:translateY(14px); opacity:1} 75%,100%{transform:translateY(18px); opacity:0}}
@media (prefers-reduced-motion: reduce){.auth-logo .moneda{animation:none}}
.auth-marca{text-align:center; font-weight:800; font-size:20px; color:var(--accent); margin:6px 0 22px}
.auth h1{text-align:center; margin:0; font-size:28px; font-weight:800}
.auth-sub{text-align:center; margin:4px 0 24px; color:var(--muted)}
.auth form{gap:14px}
.auth label{font-size:14px; color:var(--ink); font-weight:600}
.campo{position:relative}
.campo input{padding:14px 44px 14px 42px; border:2px solid var(--mint-soft); border-radius:16px; font-size:16px; background:var(--card)}
.campo input:focus{outline:none; border-color:var(--mint)}
.campo .ico{position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none; display:flex}
.campo .ver{position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--muted); cursor:pointer; padding:6px; font-size:12px; font-weight:700; font-family:inherit}
.auth-link{background:none; border:none; padding:0; color:var(--mint); font-weight:700; font-size:14px; cursor:pointer; font-family:inherit}
.auth .btn{padding:15px; font-size:16px; box-shadow:0 6px 18px color-mix(in srgb, var(--accent) 35%, transparent)}
.auth-msg{text-align:center; font-size:14px; margin-top:14px; min-height:20px}
.auth-msg.error{color:var(--neg)}
/* Medidor de contraseña: solo recomienda, nunca impide registrarse. */
.pass-medidor{margin-top:-4px; font-size:13px}
.pass-barra{display:flex; gap:4px; margin-bottom:8px}
.pass-barra i{flex:1; height:5px; border-radius:999px; background:var(--line)}
.pass-barra i.on{background:var(--aviso)}
.pass-medidor.segura .pass-barra i.on{background:var(--mint)}
.pass-estado{display:flex; align-items:center; gap:6px; font-weight:700; color:var(--aviso)}
.pass-medidor.segura .pass-estado{color:var(--mint)}
.pass-reglas{list-style:none; margin:6px 0 0; padding:0; display:grid; gap:3px; color:var(--muted)}
.pass-reglas li{display:flex; gap:6px; align-items:baseline}
.pass-reglas li b{width:14px; flex:none; text-align:center}
.pass-reglas li.ok{color:var(--ink)} .pass-reglas li.ok b{color:var(--mint)}
.pass-nota{margin-top:6px; color:var(--muted)}
.auth-pie{text-align:center; color:var(--muted); font-size:14px; margin-top:34px}
/* Navegación inferior */
.nav-inf{position:fixed; left:0; right:0; bottom:0; z-index:15; display:flex; justify-content:space-around;
  background:var(--card); border-top:1px solid var(--line); padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px)); box-shadow:0 -4px 18px rgba(74,59,59,.06)}
.nav-item{flex:1; max-width:110px; background:none; border:none; cursor:pointer; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:3px; font-size:11.5px; font-weight:700; font-family:inherit; padding:4px 0}
.nav-item svg{width:24px; height:24px}
.nav-item.active{color:var(--accent)}
#appShell.en-inicio header{display:none}
@media (min-width:768px){
  .nav-inf{display:none}
  .menu-overlay{display:none !important}
  .menu-panel{transform:none; width:248px; max-width:none; background:color-mix(in srgb, var(--card) 70%, transparent);
    border-right:1px solid var(--line); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px)}
  #appShell{padding-left:248px}
  header, main{max-width:760px}
  main{padding-bottom:48px}
}
/* Inicio */
.hola{display:flex; justify-content:space-between; align-items:center; margin:4px 0 18px}
.hola h1{margin:0; font-size:26px; font-weight:800}
.hola-perfil{display:inline-flex; align-items:center; gap:6px; background:none; border:none; padding:0; font:inherit; color:inherit; cursor:pointer; text-align:left}
.hola-perfil .estrella-premium{margin-left:0}
.hola-perfil svg{flex:none; color:var(--muted); transition:transform .2s ease}
.perfil-av{flex:none; width:40px; height:40px; border-radius:50%; background:var(--accent-soft); color:var(--accent-2); display:flex; align-items:center; justify-content:center; font-style:normal; font-weight:800; font-size:17px}
.perfil-fila{display:flex; align-items:center; gap:6px}
.perfil-btn{flex:1; display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:10px 12px; margin:0 0 8px; font:inherit; color:var(--ink); cursor:pointer; text-align:left; min-width:0}
.perfil-btn span{display:flex; flex-direction:column; min-width:0}
.perfil-btn b, .perfil-btn small{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.perfil-btn small{color:var(--muted); font-size:13px}
.perfil-btn.actual{border-color:var(--accent); cursor:default}
.perfil-btn .check{margin-left:auto; color:var(--accent-2); font-weight:800}
.perfil-olvidar{flex:none; width:34px; height:34px; margin-bottom:8px; border-radius:50%; border:none; background:none; color:var(--muted); font-size:22px; cursor:pointer}
.perfiles-tit{font-size:13px; font-weight:800; color:var(--auth-suave,var(--muted)); margin:4px 2px 8px}
.auth-perfiles{margin-bottom:10px; text-align:left}
.perfiles-lista{margin-top:14px}
.perfiles-lista .perfil-btn{width:100%}
.perfil-accion{display:block; width:100%; background:none; border:none; padding:12px 4px; font:inherit; font-weight:700; font-size:15px; color:var(--mint); text-align:left; cursor:pointer}
.perfil-accion.salir{color:var(--neg,#d9534f)}
.campana{position:relative; width:42px; height:42px; border-radius:50%; border:none; background:var(--card); box-shadow:0 2px 10px rgba(74,59,59,.1); cursor:pointer; color:var(--ink); display:flex; align-items:center; justify-content:center}
.campana .punto{position:absolute; top:9px; right:10px; width:8px; height:8px; border-radius:50%; background:var(--accent)}
.saldo-lbl{font-size:16px; font-weight:600}
.saldo{display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap; margin:2px 0 14px}
.saldo .cifra{font-size:40px; font-weight:800; letter-spacing:-0.02em; color:var(--mint); font-variant-numeric:tabular-nums; line-height:1.1}
.saldo .var{font-size:14px; font-weight:700; padding-bottom:6px}
.mini{display:flex; gap:8px; overflow-x:auto; margin-bottom:16px; scrollbar-width:none}
.mini div{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:8px 12px; white-space:nowrap}
.mini b{display:block; font-size:14px; font-variant-numeric:tabular-nums}
.mini span{font-size:11px; color:var(--muted)}
/* Tarjeta hero del Inicio */
.hero{background:color-mix(in srgb, var(--card) 85%, var(--paper)); border-radius:24px; padding:20px 18px 18px; margin-bottom:16px;
  box-shadow:0 14px 40px -12px rgba(160,110,90,.22), 0 2px 8px rgba(160,110,90,.06)}
.hero .saldo{margin-bottom:16px}
.hero-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.hero-grid div{border-radius:16px; padding:10px 12px; min-width:0}
.hero-grid span{display:block; font-size:12px; color:var(--muted); font-weight:600}
.hero-grid b{display:block; font-size:16px; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; margin-top:2px}
.t-menta{background:var(--mint-soft)} .t-melocoton{background:var(--peach-soft)}
@media (min-width:560px){ .hero-grid{grid-template-columns:repeat(4,1fr)} }
.barras-mes h2{margin-bottom:12px}
.barra-mes + .barra-mes{margin-top:14px}
.barra-cab{display:flex; justify-content:space-between; gap:10px; font-size:14px; margin-bottom:6px}
.barra-cab span{font-weight:600} .barra-cab b{font-variant-numeric:tabular-nums; text-align:right}
.barras-mes .barra{height:12px}
.barras-mes .barra div{transition:width .5s cubic-bezier(.3,1.3,.5,1)}
.barra-mes .meta{margin-top:4px}
.card.grafico{border:2px solid var(--mint-soft)}
.acciones{display:flex; gap:6px; margin:4px -16px 22px; padding:0 16px; overflow-x:auto; scrollbar-width:none; align-items:flex-start}
.acciones::-webkit-scrollbar{display:none}
.accion{flex:0 0 76px; background:none; border:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px; color:var(--ink); font-size:13px; font-weight:600; font-family:inherit}
.accion i{font-style:normal; width:54px; height:54px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:24px}
.accion.nueva i{background:transparent; border:2px dashed var(--line); color:var(--muted); font-size:22px}
.acciones-pista{align-self:center; margin:0 0 18px 4px}
.elegir-acciones{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:16px; max-height:52vh; overflow-y:auto; padding:2px}
.elegir{position:relative; background:var(--card); border:2px solid var(--line); border-radius:18px; padding:12px 6px 10px; display:flex; flex-direction:column; align-items:center; gap:6px; font-family:inherit; font-size:12.5px; font-weight:700; color:var(--ink); cursor:pointer}
.elegir i{font-style:normal; width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:21px}
.elegir.sel{border-color:var(--accent); background:var(--accent-soft)}
.elegir b{position:absolute; top:6px; right:8px; width:20px; height:20px; border-radius:50%; background:var(--accent); color:#fff; font-size:11px; display:flex; align-items:center; justify-content:center}
.tit-fila{display:flex; justify-content:space-between; align-items:baseline; margin:0 0 10px}
.tit-fila h2{margin:0}
/* Ojito de privacidad */
.icono-btn.ojo{background:var(--lav-soft); color:#7a6cc9; box-shadow:none}
.icono-btn.ojo.activo{background:#7a6cc9; color:#fff}
/* Hoja inferior de confirmación */
#hoja{position:fixed; inset:0; z-index:80}
.hoja-fondo{position:absolute; inset:0; background:rgba(40,28,30,.38); opacity:0; transition:opacity .25s ease}
.hoja{position:absolute; left:0; right:0; bottom:0; max-width:520px; margin:0 auto; background:var(--hoja,#fffaf4); color:var(--ink);
  border-radius:28px 28px 0 0; padding:10px 22px calc(22px + env(safe-area-inset-bottom,0px)); text-align:center;
  box-shadow:0 -10px 40px rgba(40,28,30,.18); transform:translateY(105%); transition:transform .34s cubic-bezier(.32,1.25,.5,1)}
:root[data-theme="dark"] .hoja{--hoja:var(--card)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .hoja{--hoja:var(--card)} }
#hoja.abierta .hoja-fondo{opacity:1}
#hoja.abierta .hoja{transform:translateY(0)}
.hoja-asa{width:42px; height:5px; border-radius:999px; background:var(--line); margin:0 auto 16px}
.hoja-ico{width:62px; height:62px; border-radius:50%; background:var(--peach-soft); margin:0 auto 12px; display:flex; align-items:center; justify-content:center; font-size:28px}
.hoja h2{font-size:19px; margin:0 0 6px}
.hoja p{margin:0 0 4px; color:var(--muted); font-size:14px; line-height:1.45}
.hoja-btns{display:flex; gap:10px; margin-top:20px}
.hoja-btns button{flex:1; border:none; border-radius:999px; padding:14px 12px; font-family:inherit; font-size:15px; font-weight:800; cursor:pointer}
.hoja-no{background:#eeeae8; color:#6f6461}
.hoja-si{background:#f9c7a8; color:#7a3f1d}
.hoja-si.peligro{background:var(--neg); color:#fff}
.hoja-btns-arrastre{flex-direction:column}
.hoja-ico.arrastre-neg{background:var(--lav-soft)}
:root[data-theme="dark"] .hoja-no{background:#3a3334; color:#d8cfcd}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .hoja-no{background:#3a3334; color:#d8cfcd} }
@media (prefers-reduced-motion: reduce){ .hoja, .hoja-fondo{transition:none} }
/* Bienvenida: tres tarjetas al entrar por primera vez; la segunda es larga y se desplaza dentro de la hoja */
.hoja-bienvenida{display:flex; flex-direction:column; max-height:min(88vh, 760px)}
.bv-cuerpo{overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; min-height:0; flex:1 1 auto; padding:0 2px}
.bv-texto{text-align:left; font-size:14px; line-height:1.5; color:var(--muted)}
.bv-texto p{margin:0 0 10px}
.bv-texto h3{font-size:15px; color:var(--ink); margin:16px 0 6px}
.bv-texto ul{margin:0 0 6px; padding-left:18px}
.bv-texto li{margin:0 0 6px}
.bv-texto b{color:var(--ink)}
.bv-cita{text-align:center; font-weight:700; color:var(--ink)}
.bv-nota{background:var(--mint-soft); border-radius:18px; padding:12px 14px}
.bv-extra{background:var(--lav-soft); border-radius:20px; padding:4px 14px 8px; margin-top:16px}
.bv-cierre{text-align:center; margin-top:14px !important}
.bv-tag{display:inline-block; background:var(--peach-soft); color:var(--ink); border-radius:999px; padding:0 8px; font-weight:700; font-size:.92em}
.bv-puntos{display:flex; justify-content:center; gap:6px; margin-top:14px}
.bv-puntos span{width:7px; height:7px; border-radius:50%; background:var(--line); transition:width .2s ease, background .2s ease}
.bv-puntos span.activo{width:20px; border-radius:999px; background:var(--accent)}
.hoja-bienvenida .hoja-btns{margin-top:12px}
.hoja-bienvenida .hoja-si:focus-visible{outline:3px solid var(--accent-soft); outline-offset:2px}
/* Cierre del mes: banner y ventana con la tarjeta descargable */
.cierre-banner{display:flex; align-items:center; gap:14px; flex-wrap:wrap; background:linear-gradient(135deg, var(--accent-soft), var(--card) 70%)}
.cierre-banner-ico{width:48px; height:48px; border-radius:50%; background:var(--card); display:flex; align-items:center; justify-content:center; font-size:24px; flex-shrink:0}
.cierre-banner .btn{margin-left:auto}
.cierre-banner .btn:disabled{opacity:.5; cursor:default}
#cierre{position:fixed; inset:0; z-index:80; display:flex; align-items:center; justify-content:center; padding:16px}
.cierre-fondo{position:absolute; inset:0; background:rgba(40,28,30,.55); opacity:0; transition:opacity .25s ease}
.cierre-panel{position:relative; width:100%; max-width:440px; max-height:100%; overflow:auto; background:var(--card); color:var(--ink); border-radius:28px;
  padding:16px; box-shadow:0 10px 40px rgba(40,28,30,.25); transform:scale(.94); opacity:0; transition:transform .3s cubic-bezier(.32,1.25,.5,1), opacity .2s ease}
#cierre.abierta .cierre-fondo{opacity:1}
#cierre.abierta .cierre-panel{transform:scale(1); opacity:1}
.cierre-panel img{display:block; width:100%; height:auto; max-height:62vh; object-fit:contain; border-radius:18px}
.cierre-x{position:absolute; top:24px; right:24px; width:36px; height:36px; border-radius:50%; border:none; background:rgba(255,255,255,.85); color:#4a3b3b; font-size:16px; cursor:pointer}
.cierre-ocultar{display:flex; align-items:center; gap:8px; margin:12px 4px 0; font-size:13.5px; color:var(--ink); cursor:pointer}
.cierre-ocultar input{width:auto; margin:0}
.cierre-btns{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap}
.cierre-btns .btn{flex:1 1 110px}
@media (prefers-reduced-motion: reduce){ .cierre-panel, .cierre-fondo{transition:none} }
/* Estados vacíos */
.vacio{display:flex; flex-direction:column; align-items:center; text-align:center; gap:4px; padding:22px 16px 26px}
.vacio svg{margin-bottom:8px; animation:flotar 3.6s ease-in-out infinite}
.vacio b{font-size:16px; font-weight:800}
.vacio span{font-size:13.5px; color:var(--muted); max-width:280px; line-height:1.4}
@keyframes flotar{50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion: reduce){ .vacio svg{animation:none} }
/* Gráficas: al tocar o pasar el ratón se ve el importe de ese punto */
.graf-int{position:relative; touch-action:pan-y; -webkit-user-select:none; user-select:none; cursor:crosshair}
.graf-linea{position:absolute; top:0; bottom:13%; width:0; border-left:1.5px dashed var(--muted); opacity:0; pointer-events:none; transition:opacity .15s}
.graf-punto{position:absolute; width:12px; height:12px; margin:-6px 0 0 -6px; border-radius:50%; background:var(--card); border:2.5px solid; pointer-events:none; transition:left .08s, top .08s}
.graf-tip{position:absolute; top:0; transform:translate(-50%,-45%); background:var(--ink); color:var(--paper); border-radius:12px; padding:6px 10px; font-size:12px; line-height:1.35; white-space:nowrap; pointer-events:none; opacity:0; transition:opacity .15s; z-index:3; box-shadow:0 6px 16px rgba(0,0,0,.18)}
.graf-tip b{display:block; font-size:14px; font-variant-numeric:tabular-nums}
.graf-tip i{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; font-style:normal}
.graf-tip span{opacity:.75}
.graf-int.activa .graf-linea, .graf-int.activa .graf-tip{opacity:1}
/* Notificaciones */
.aviso{position:relative}
.fila.aviso .ico{border-radius:50%}
.fila.aviso .txt .meta{white-space:normal}
.fila.aviso .txt b{white-space:normal}
.aviso .flecha{color:var(--muted); flex-shrink:0}
.aviso.nuevo{border-color:var(--accent)}
.titulo-novedades{margin:22px 4px 10px; font-size:15px}
.fila.aviso .fecha-novedad{font-size:11px; opacity:.7; margin-top:2px}
.aviso.nuevo::after{content:""; position:absolute; top:10px; right:10px; width:8px; height:8px; border-radius:50%; background:var(--accent)}
.aviso-caja{position:relative}
.aviso-caja .fila.aviso{padding-right:46px}
.aviso-caja .aviso.nuevo::after{right:auto; left:8px; top:8px}
.aviso-borrar{position:absolute; top:0; bottom:0; margin:auto 0; right:6px; width:34px; height:34px; border:none; border-radius:50%; background:transparent; color:var(--muted); display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0}
.aviso-borrar:hover{background:var(--line); color:var(--ink)}
/* Cifras que se adaptan al ancho (importes largos en pantallas estrechas) */
.cifra-adapt{font-size:clamp(22px,7.5vw,30px); font-weight:800; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; line-height:1.15; margin:4px 0 2px; overflow-wrap:anywhere; min-width:0}
.mini.ajustable{flex-wrap:wrap; overflow:visible}
.mini.ajustable div{flex:1 1 auto; min-width:0}
.mini.ajustable b{overflow-wrap:anywhere}
/* Imagen de fondo personalizada, con un velo del color de fondo para que se lea bien */
html.con-imagen body::before{content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:linear-gradient(color-mix(in srgb, var(--paper) var(--velo,55%), transparent), color-mix(in srgb, var(--paper) var(--velo,55%), transparent)), var(--fondo-img) center/cover no-repeat}
html.con-imagen body{background:var(--paper)}
/* Personalización */
.opciones{display:flex; gap:8px; flex-wrap:wrap}
.opcion{flex:1; min-width:84px; border:2px solid var(--line); background:var(--card); color:var(--ink); border-radius:16px; padding:10px 8px; cursor:pointer; font-family:inherit; font-size:13px; font-weight:700; display:flex; flex-direction:column; align-items:center; gap:6px}
.opcion.sel{border-color:var(--accent); background:var(--accent-soft)}
.opcion .muestra{width:100%; height:34px; border-radius:10px; border:1px solid var(--line)}
.colores{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.color{width:40px; height:40px; border-radius:50%; border:3px solid var(--card); box-shadow:0 0 0 1.5px var(--line); cursor:pointer; padding:0}
.color.sel{box-shadow:0 0 0 2.5px var(--ink)}
.color-propio{position:relative; width:40px; height:40px; border-radius:50%; overflow:hidden; box-shadow:0 0 0 1.5px var(--line); background:conic-gradient(#f07f76,#f2a65a,#d9c441,#7cc26b,#3fae92,#5aa9e6,#8b7fd6,#e98bb5,#f07f76)}
.color-propio.sel{box-shadow:0 0 0 2.5px var(--ink)}
.color-propio input{position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; padding:0; border:none}
.vista-img{height:120px; border-radius:16px; background:var(--line) center/cover no-repeat; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px; font-weight:600}
input[type=range]{padding:0; border:none; background:none; accent-color:var(--accent)}
/* Filas tipo tarjeta (movimientos) */
.fila{display:flex; align-items:center; gap:12px; padding:10px 12px; background:var(--card); border:1px solid var(--line); border-radius:16px; width:100%; text-align:left; font-family:inherit; color:var(--ink); font-size:14px}
button.fila{cursor:pointer; -webkit-tap-highlight-color:transparent}
.fila .ico{width:40px; height:40px; border-radius:12px; background:var(--peach-soft); display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0}
.fila .ico.ing{background:var(--mint-soft)} .fila .ico.tr{background:var(--lav-soft)}
.fila .txt{flex:1; min-width:0}
.fila .txt b{display:block; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.fila .txt .meta{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.fila .der{text-align:right; flex-shrink:0}
.fila .der b{font-size:15px; font-variant-numeric:tabular-nums; white-space:nowrap}
.fila.abierta{border-color:var(--accent); border-bottom-left-radius:6px; border-bottom-right-radius:6px}
.fila-extra{background:var(--card); border:1px solid var(--accent); border-top:none; border-radius:0 0 16px 16px; margin-top:-9px; padding:12px; display:flex; flex-direction:column; gap:10px}
.fila-extra .meta{line-height:1.4}
.fila-extra label{margin-bottom:-6px}
.ico-cat{width:40px; height:40px; border-radius:12px; background:var(--peach-soft); display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chips-filtro{display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; margin:0 -16px 12px; padding:2px 16px}
.chips-filtro::-webkit-scrollbar{display:none}
.chip-filtro{flex:0 0 auto; border:1.5px solid var(--line); background:var(--card); color:var(--ink); font-family:inherit; font-size:13px; font-weight:600;
  padding:7px 13px; border-radius:999px; cursor:pointer; white-space:nowrap; transition:background .15s, border-color .15s}
.chip-filtro.sel{background:var(--accent-soft); border-color:color-mix(in srgb, var(--accent) 40%, transparent); color:var(--accent)}
.chip{border:none; background:var(--accent-soft); color:var(--accent); font-family:inherit; font-size:12.5px; font-weight:700; padding:7px 12px; border-radius:999px; cursor:pointer}
.chip.ok{background:var(--mint-soft); color:var(--mint)} .chip.lav{background:var(--lav-soft); color:#7a6cc9}
/* Huchas de ahorro: barra de iconos que se va rellenando */
.hucha-barra{display:flex; align-items:center; gap:10px; margin-top:12px}
.hucha-burbuja{width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0}
.hucha-capsula{flex:1; height:12px; border-radius:999px; background:var(--line); position:relative}
.hucha-relleno{position:relative; height:100%; min-width:12px; border-radius:999px; background:linear-gradient(90deg, var(--g1), var(--g2));
  box-shadow:0 0 10px -1px color-mix(in srgb, var(--g2) 70%, transparent); animation:hucha-crece .8s cubic-bezier(.25,.8,.3,1) both}
.hucha-punta{position:absolute; right:2px; top:50%; width:8px; height:8px; margin-top:-4px; border-radius:50%; background:#fff;
  box-shadow:0 0 0 2px color-mix(in srgb, #fff 35%, transparent), 0 0 8px 2px color-mix(in srgb, #fff 70%, transparent)}
.hucha-pct{font-family:"Nunito",sans-serif; font-size:12.5px; font-weight:700; color:var(--muted); min-width:34px; text-align:right; font-variant-numeric:tabular-nums}
@keyframes hucha-crece{from{width:0}}
.sin-brillo .hucha-relleno{box-shadow:none}
.sin-brillo .hucha-punta{display:none}
.hucha-icono{width:46px; height:46px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:25px; flex-shrink:0}
.temas-hucha{display:flex; gap:6px; flex-wrap:wrap; margin:4px 0 10px}
.temas-hucha label{margin:0; cursor:pointer}
.temas-hucha input{position:absolute; opacity:0; pointer-events:none}
.temas-hucha span, .temas-hucha button{display:flex; align-items:center; justify-content:center; width:42px; height:42px; border-radius:14px; font-size:21px; background:var(--card); border:2px solid var(--line); cursor:pointer; font-family:inherit; padding:0}
.temas-hucha input:checked + span, .temas-hucha button.activo{border-color:var(--accent); background:var(--accent-soft)}
.temas-hucha input:focus-visible + span{outline:2px solid var(--accent); outline-offset:2px}
@media (prefers-reduced-motion: reduce){ .hucha-relleno{animation:none} }
.chip.peligro{background:transparent; color:var(--muted); border:1.5px solid var(--line)}
/* El rojo de alerta solo aparece al pulsar (la acción se está confirmando) */
.chip.peligro:active{color:var(--neg); border-color:var(--neg)}
.dia{font-size:13px; font-weight:800; color:var(--muted); margin:16px 4px 8px; display:flex; justify-content:space-between}
.dia:first-child{margin-top:4px}
/* Buscador */
.buscador{display:flex; gap:8px; margin:6px 0 4px}
.buscar{position:relative; flex:1; min-width:0}
.buscar svg{position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none}
.buscar input{padding-left:38px; border-radius:999px; background:var(--card)}
.buscador select{width:auto; max-width:45%; border-radius:999px; background:var(--card)}
/* Tarjetas de cifras */
.stats{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px}
.stat{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:14px}
.stat i{font-style:normal; width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; margin-bottom:8px}
.stat b{display:block; font-size:20px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-0.01em}
.stat span{font-size:12px; color:var(--muted); font-weight:600}
.stat.ancha{grid-column:1/-1}
.barra{height:10px; background:var(--line); border-radius:999px; overflow:hidden}
.barra div{height:100%; border-radius:999px; background:var(--mint)}
/* Plegables (tarjetas de añadir) */
.pleg-cab{display:flex; align-items:center; gap:12px; cursor:pointer}
.pleg-cab i{font-style:normal; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:19px; flex-shrink:0}
.pleg-cab h2{flex:1; margin:0}
.pleg-cab .chev{color:var(--muted); transition:transform .2s ease; display:flex}
.pleg-cab.abierto .chev{transform:rotate(180deg)}
.pleg-cuerpo{display:grid; grid-template-rows:0fr; visibility:hidden;
  transition:grid-template-rows .32s cubic-bezier(.22,1,.36,1), visibility 0s linear .32s}
.pleg-cuerpo.abierto{grid-template-rows:1fr; visibility:visible; transition:grid-template-rows .32s cubic-bezier(.22,1,.36,1), visibility 0s}
.pleg-interior{min-height:0; overflow:hidden; opacity:0; transform:translateY(-6px);
  transition:opacity .2s ease, transform .2s ease}
.pleg-cuerpo.abierto .pleg-interior{opacity:1; transform:translateY(0);
  transition:opacity .26s ease .06s, transform .34s cubic-bezier(.34,1.56,.64,1) .06s}
.pleg-cuerpo.asentado .pleg-interior{overflow:visible; transform:none}
.pleg-interior::before{content:""; display:block; height:12px} /* separación con la cabecera, se pliega con el resto */
/* Categorías con barra */
.cat-fila{display:flex; align-items:center; gap:12px; width:100%; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:10px 12px; cursor:pointer; font-family:inherit; color:var(--ink); text-align:left}
.cat-fila.sel{border-color:var(--accent); background:var(--accent-soft)}
.cat-fila .ico{width:40px; height:40px; border-radius:12px; background:var(--peach-soft); display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0}
.cat-fila .txt{flex:1; min-width:0}
.cat-fila .top{display:flex; justify-content:space-between; gap:8px; font-size:14.5px; font-weight:700; margin-bottom:6px}
.cat-fila .barra{height:6px}
/* Respuesta táctil «esponjosa»: todo lo que se pulsa se encoge un poco y rebota al soltar */
button, .fila, .cat-fila, .color-propio, .pleg-cab, .item[data-expandir-inv], .item[data-toggle-grupo], [data-resumen-sel]{
  transition:transform .22s cubic-bezier(.34,1.56,.64,1), background .15s ease, box-shadow .15s ease, filter .15s ease;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
}
button:not(:disabled):active, .fila:active, .cat-fila:active, .color-propio:active, .item[data-expandir-inv]:active, .item[data-toggle-grupo]:active{
  transform:scale(.97); transition-duration:.08s;
}
.pleg-cab:active{transform:scale(.98); transition-duration:.08s}
.nav-item:not(:disabled):active, .accion:not(:disabled):active, .color:not(:disabled):active, .icono-btn:not(:disabled):active, .campana:not(:disabled):active{transform:scale(.92)}
@media (hover:hover){
  .fila:is(button):hover, .cat-fila:hover, .opcion:hover, .item[data-expandir-inv]:hover{box-shadow:0 6px 18px rgba(74,59,59,.09)}
  .chip:hover, .accion:hover i, .color:hover{filter:brightness(.97)}
}
@media (prefers-reduced-motion: reduce){
  button, .fila, .cat-fila, .color-propio, .pleg-cab, .item, .pleg-cuerpo, .pleg-interior{transition:none!important}
  button:active, .fila:active, .cat-fila:active, .pleg-cab:active, .item:active, .color-propio:active{transform:none!important}
}
/* ¿Me lo puedo permitir? */
.permitir-lista{display:flex; flex-direction:column; gap:14px; margin-top:10px}
.permitir-fila{display:flex; gap:12px; align-items:flex-start}
.permitir-tit{font-size:13.5px; font-weight:700; color:var(--muted)}
.permitir-cifras{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; font-variant-numeric:tabular-nums}
.permitir-cifras strong{font-size:20px; font-weight:800}
.permitir-huchas{display:flex; flex-direction:column; gap:6px; margin:-4px 0 0 56px}
.permitir-hucha{display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; font-size:14px}
.permitir-hucha b{margin-left:auto}

/* Simulador de vivienda */
.viv-col{min-width:92px; font-variant-numeric:tabular-nums}

/* Hitos */
.hitos-cab{text-align:center; background:linear-gradient(135deg, var(--peach-soft), var(--card) 75%)}
.hitos-cuenta{font-size:15px; color:var(--muted); margin-top:4px}
.hitos-cuenta b{font-size:30px; color:var(--ink); font-weight:800}
.rachas{display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:12px; margin-bottom:6px}
.racha{display:flex; gap:12px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:14px}
.racha-ico{width:44px; height:44px; flex-shrink:0; border-radius:50%; background:var(--line); display:flex; align-items:center; justify-content:center; font-size:22px; filter:grayscale(1); opacity:.6}
.racha.viva .racha-ico{background:var(--peach-soft); filter:none; opacity:1}
.hitos-grid{display:grid; grid-template-columns:repeat(4, 1fr); gap:10px}
@media (min-width:700px){ .hitos-grid{grid-template-columns:repeat(6, 1fr)} }
.hito{background:var(--card); border:2px solid var(--line); border-radius:18px; padding:12px 4px 10px; display:flex; flex-direction:column; align-items:center; gap:6px; font-family:inherit; color:var(--muted); cursor:pointer; min-width:0}
.hito.ok{border-color:color-mix(in srgb, var(--accent) 45%, var(--line)); background:linear-gradient(180deg, var(--accent-soft), var(--card)); color:var(--ink)}
.hito-ico{font-size:28px; line-height:1}
.hito:not(.ok) .hito-ico{opacity:.55}
.hito-nom{font-size:11px; font-weight:700; line-height:1.2; text-align:center; overflow-wrap:break-word; hyphens:auto; max-width:100%}
.hito-hoja-ico{font-size:34px; background:var(--accent-soft)}
.hito-hoja-ico.bloqueado{background:var(--line)}
/* ¿Cómo estoy? */
.salud-cab{background:linear-gradient(135deg, var(--mint-soft), var(--card) 75%)}
.salud-lista{display:flex; flex-direction:column; gap:6px; margin-top:12px}
.salud-fila{display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px 14px; font:inherit; font-size:15px; color:var(--ink); cursor:pointer}
.salud-luz{font-size:18px; line-height:1}
.salud-txt{flex:1; min-width:0}
.salud-pts{font-weight:800; color:var(--muted); font-size:13px}
.salud-detalle{padding:2px 14px 8px 42px}
.salud-detalle p{margin:0 0 4px}
.salud-nota{display:flex; align-items:center; gap:16px; margin-top:18px; flex-wrap:wrap}
.salud-nota strong{font-size:18px}
.salud-nota p{margin:4px 0 0}
.salud-anillo{width:108px; height:108px; flex-shrink:0}
.salud-ajustes-cab{display:flex; justify-content:space-between; align-items:center; width:100%; background:none; border:0; padding:0; font:inherit; color:var(--ink); cursor:pointer}
.salud-ajustes-cab h2{margin:0}
.salud-form{margin-top:12px}
.salud-campo{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px}
.salud-campo select{width:auto}
.salud-num{display:flex; align-items:center; gap:6px; flex-shrink:0}
.salud-num input{width:78px; text-align:right}
.salud-num i{font-style:normal; color:var(--muted); font-size:12px; max-width:90px}
</style>

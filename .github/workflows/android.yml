name: App Android (WebView)

on:
  push:
    branches: [android-webview]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Compilar .aab (sin firmar) y .apk de prueba
        run: gradle -p android bundleRelease assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pocketz-android
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/debug/app-debug.apk

  probar-en-emulador:
    needs: compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pocketz-android
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r apk/debug/app-debug.apk
            adb shell am start -W -n com.labs_pocketz/.MainActivity
            sleep 40
            adb exec-out screencap -p > captura-inicio.png
            adb shell dumpsys activity activities | grep -i "mResumedActivity\|topResumedActivity" > actividad.txt || true
            adb logcat -d > logcat.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prueba-emulador
          path: |
            captura-inicio.png
            actividad.txt
            logcat.txt

  # Deja el .aab y la prueba en la rama android-salida para poder descargarlos con git
  publicar:
    needs: [compilar, probar-en-emulador]
    if: always() && needs.compilar.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: salida
      - name: Subir a la rama android-salida
        run: |
          cd salida
          git init -q -b android-salida
          git config user.name "PaulaRamis04"
          git config user.email "83275575+PaulaRamis04@users.noreply.github.com"
          git add -A
          git commit -q -m "Compilación ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" android-salida
